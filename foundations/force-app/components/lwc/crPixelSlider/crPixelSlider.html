<template>
    <div class="slds-form-element">
        <label class="slds-form-element__label" for="slider">
            <span class="slds-slider-label">
                <span class="slds-slider-label__label">{label}</span>
                <span class="slds-slider-label__range">{rangeLabel}</span>
            </span>
        </label>
        <div class="slds-form-element__control">
            <div class="slds-slider">
                <input
                    id="slider"
                    type="range"
                    class="slds-slider__range"
                    min="0"
                    max={max}
                    step="1"
                    value={pixels}
                    oninput={handleInput}
                    onchange={handleChange}
                />
                <span class="slds-slider__value" style={valueStyle} aria-hidden="true">{pixels}</span>
            </div>
        </div>
    </div>
</template>
