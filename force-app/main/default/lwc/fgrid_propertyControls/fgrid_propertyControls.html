<template>
    <template lwc:if={hasControls}>
        <template for:each={controls} for:item="control">
            <div class="control" key={control.key}>
                <template lwc:if={control.isCheckbox}>
                    <lightning-input
                        type="checkbox"
                        data-validatable
                        data-property={control.property}
                        label={control.label}
                        field-level-help={control.help}
                        checked={control.value}
                        disabled={control.disabled}
                        onchange={handleCheckbox}
                    ></lightning-input>
                </template>

                <template lwc:elseif={control.isSelect}>
                    <lightning-combobox
                        data-validatable
                        data-property={control.property}
                        label={control.label}
                        field-level-help={control.help}
                        value={control.value}
                        options={control.options}
                        disabled={control.disabled}
                        required={control.required}
                        onchange={handleSelect}
                    ></lightning-combobox>
                </template>

                <template lwc:elseif={control.isText}>
                    <c-flow-config-value-input
                        data-validatable
                        data-property={control.property}
                        label={control.label}
                        property-name={control.property}
                        value={control.value}
                        value-data-type={control.dataType}
                        value-type="String"
                        required={control.required}
                        placeholder={control.placeholder}
                        field-level-help={control.help}
                        builder-context={builderContext}
                        automatic-output-variables={automaticOutputVariables}
                        api-version={apiVersion}
                        onvaluechange={handleValue}
                    ></c-flow-config-value-input>
                </template>

                <template lwc:elseif={control.isNumber}>
                    <c-flow-config-value-input
                        data-validatable
                        data-property={control.property}
                        label={control.label}
                        property-name={control.property}
                        value={control.value}
                        value-data-type={control.dataType}
                        value-type="Number"
                        required={control.required}
                        placeholder={control.placeholder}
                        field-level-help={control.help}
                        builder-context={builderContext}
                        automatic-output-variables={automaticOutputVariables}
                        api-version={apiVersion}
                        onvaluechange={handleValue}
                    ></c-flow-config-value-input>
                </template>

                <template lwc:elseif={control.isIcon}>
                    <c-fgrid_icon-picker
                        data-validatable
                        data-property={control.property}
                        label={control.label}
                        field-level-help={control.help}
                        value={control.value}
                        disabled={control.disabled}
                        oniconchange={handleIcon}
                    ></c-fgrid_icon-picker>
                </template>

                <template lwc:elseif={control.isResource}>
                    <c-flow-config-resource-picker
                        data-validatable
                        data-property={control.property}
                        label={control.label}
                        property-name={control.property}
                        value={control.value}
                        accepted-types={control.acceptedTypes}
                        collection={control.collection}
                        required={control.required}
                        field-level-help={control.help}
                        builder-context={builderContext}
                        automatic-output-variables={automaticOutputVariables}
                        api-version={apiVersion}
                        onresourcechange={handleResource}
                    ></c-flow-config-resource-picker>
                </template>

                <template lwc:elseif={control.isField}>
                    <c-flow-config-field-picker
                        data-validatable
                        data-property={control.property}
                        label={control.label}
                        property-name={control.property}
                        value={control.value}
                        object-api-name={objectApiName}
                        accepted-types={control.acceptedTypes}
                        required={control.required}
                        field-level-help={control.help}
                        onfieldchange={handleField}
                    ></c-flow-config-field-picker>
                </template>

                <template lwc:elseif={control.isFields}>
                    <c-flow-config-field-picker
                        data-validatable
                        data-property={control.property}
                        label={control.label}
                        property-name={control.property}
                        value={control.value}
                        object-api-name={objectApiName}
                        accepted-types={control.acceptedTypes}
                        multiple
                        sortable
                        required={control.required}
                        field-level-help={control.help}
                        onfieldchange={handleField}
                    ></c-flow-config-field-picker>
                </template>
            </div>
        </template>
    </template>
</template>
