<template>
    <div class="flowconfig">
        <template lwc:if={hasError}>
            <div class="slds-box slds-box_x-small slds-theme_error slds-m-bottom_x-small" role="alert">
                <p>{errorMessage}</p>
            </div>
        </template>

        <template lwc:if={hasFlows}>
            <lightning-combobox
                class="flowconfig__list"
                data-validatable
                data-property="rowActionFlowApiName"
                label={label}
                placeholder="Select an active flow"
                value={flowApiName}
                options={flowOptions}
                required={required}
                field-level-help={help}
                onchange={handleFlowChange}
            ></lightning-combobox>

            <template lwc:if={hasLaunchModeNote}>
                <p class="flowconfig__summary">{launchModeNote}</p>
            </template>
        </template>
        <template lwc:else>
            <p class="slds-text-body_small slds-text-color_weak">
                No launchable active flows were found. A flow must be activated, and be either a screen flow or an
                autolaunched flow, before a row action can launch it.
            </p>
        </template>

        <template lwc:if={hasFlowSelected}>
            <template lwc:if={hasVersionNote}>
                <div class="slds-box slds-box_x-small slds-theme_warning slds-m-vertical_x-small" role="alert">
                    <p>{versionNote}</p>
                </div>
            </template>

            <lightning-combobox
                class="flowconfig__list"
                data-property="rowActionFlowRecordVariable"
                label="Send the row's record to"
                value={recordValue}
                options={recordOptions}
                field-level-help="Input variable in the flow that receives the whole record."
                onchange={handleRecordChange}
            ></lightning-combobox>

            <lightning-combobox
                class="flowconfig__list"
                data-property="rowActionFlowIdVariable"
                label="Send the row's Id to"
                value={idValue}
                options={idOptions}
                field-level-help="Input variable that receives just the record Id, for flows that re-query."
                onchange={handleIdChange}
            ></lightning-combobox>

            <lightning-combobox
                class="flowconfig__list"
                data-property="rowActionFlowOutputVariable"
                label="Read the edited record from"
                value={outputValue}
                options={outputOptions}
                field-level-help="Output variable holding the record to upsert back into the grid. Leave unset if the flow returns individual field values named after your columns instead."
                onchange={handleOutputChange}
            ></lightning-combobox>

            <lightning-combobox
                class="flowconfig__list"
                data-property="rowActionFlowStatusVariable"
                label="Read a status from"
                value={statusValue}
                options={statusOptions}
                field-level-help="Optional. An output variable reporting what the flow did. Surfaced as Last Action Status, and a Boolean decides whether the row is recorded as actioned."
                onchange={handleStatusChange}
            ></lightning-combobox>

            <template lwc:if={hasStatusHint}>
                <p class="flowconfig__summary">{statusHint}</p>
            </template>

            <div class="flowconfig__actions">
                <lightning-button
                    variant="base"
                    label="Refresh variables"
                    icon-name="utility:refresh"
                    disabled={isRefreshing}
                    onclick={handleRefresh}
                ></lightning-button>
                <template lwc:if={isRefreshing}>
                    <span class="flowconfig__summary slds-m-left_x-small">Refreshing…</span>
                </template>
            </div>

            <template lwc:if={hasStaleMappings}>
                <div class="slds-box slds-box_x-small slds-theme_warning slds-m-top_x-small" role="alert">
                    <ul class="slds-list_dotted">
                        <template for:each={staleMappings} for:item="stale">
                            <li key={stale.key}>{stale.message}</li>
                        </template>
                    </ul>
                </div>
            </template>

            <template lwc:if={hasObjectMismatch}>
                <div class="slds-box slds-box_x-small slds-theme_error slds-m-top_x-small" role="alert">
                    <p>{objectMismatch}</p>
                </div>
            </template>
        </template>
    </div>
</template>
