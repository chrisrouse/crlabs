<template>
    <div class="flowconfig">
        <template lwc:if={hasError}>
            <div class="slds-box slds-box_x-small slds-theme_error slds-m-bottom_x-small" role="alert">
                <p>{errorMessage}</p>
            </div>
        </template>

        <template lwc:if={hasFlows}>
            <lightning-combobox
                class="flowconfig__list"
                data-validatable
                data-property="rowActionFlowApiName"
                label={label}
                placeholder="Select an active flow"
                value={flowApiName}
                options={flowOptions}
                required={required}
                field-level-help={help}
                onchange={handleFlowChange}
            ></lightning-combobox>

            <template lwc:if={hasLaunchModeNote}>
                <p class="flowconfig__summary">{launchModeNote}</p>
            </template>
        </template>
        <template lwc:else>
            <p class="slds-text-body_small slds-text-color_weak">
                No launchable active flows were found. A flow must be activated, and be either a screen flow or an
                autolaunched flow, before a row action can launch it.
            </p>
        </template>

        <template lwc:if={hasFlowSelected}>
            <lightning-input
                type="text"
                data-property="rowActionFlowRecordVariable"
                label="Send the row's record to"
                placeholder="Variable name in the launched flow"
                value={recordVariable}
                field-level-help="API name of an SObject input variable in that flow. Leave blank to send no record."
                onchange={handleVariableChange}
            ></lightning-input>

            <lightning-input
                type="text"
                data-property="rowActionFlowIdVariable"
                label="Send the row's Id to"
                placeholder="Variable name in the launched flow"
                value={idVariable}
                field-level-help="API name of a text input variable in that flow, for flows that re-query. Leave blank to send no Id."
                onchange={handleVariableChange}
            ></lightning-input>

            <p class="flowconfig__summary">
                Names must match the launched flow exactly. A name that flow does not declare is not sent, and the grid
                reports it when the action runs. The flow's edited record is read back from the same variable.
            </p>
        </template>
    </div>
</template>
