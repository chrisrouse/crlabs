<template>
    <!-- The header, footer, close button, backdrop, focus trap and Escape handling
         all belong to lightning/modal now. The tagline goes between the header
         tags, which is where the component documents it should live. -->
    <lightning-modal-header label="Grid Studio">
        <p class="slds-m-top_x-small slds-text-body_small">
            Changes apply immediately and are saved with the Flow element.
        </p>
    </lightning-modal-header>

    <lightning-modal-body>
        <div class="studio__content">
            <!-- ================= left: fields and data ==================
                 Flow Builder's own left palette (15rem, slds-size_small): a
                 Fields tab listing what the records carry, and the Data
                 settings. Informed by Avonni's builder, which lists an object's
                 fields here. -->
            <div class="studio__palette slds-size_small slds-border_right">
                <lightning-tabset active-tab-value={currentLeftTab}>
                    <lightning-tab label="Fields" value="fields" onactive={handleLeftTabActive}>
                        <template lwc:if={isFieldsTab}>
                            <c-fgrid_field-palette
                                object-api-name={objectApiName}
                                records-value={values.records}
                                builder-context={builderContext}
                                column-fields={values.columnFields}
                                oncolumnfieldschange={handlePaletteFieldsChange}
                            ></c-fgrid_field-palette>
                        </template>
                    </lightning-tab>
                    <lightning-tab
                        label="Data"
                        value="data"
                        show-error-indicator={dataTabHasErrors}
                        onactive={handleLeftTabActive}
                    >
                        <template lwc:if={isLeftDataTab}>
                            <lightning-accordion allow-multiple-sections-open active-section-name={openSections}>
                                <template for:each={dataSections} for:item="section">
                                    <lightning-accordion-section
                                        key={section.name}
                                        name={section.name}
                                        label={section.label}
                                    >
                                        <c-fgrid_property-controls
                                            section={section}
                                            values={values}
                                            value-data-types={valueDataTypes}
                                            object-api-name={objectApiName}
                                            builder-context={builderContext}
                                            automatic-output-variables={automaticOutputVariables}
                                            api-version={apiVersion}
                                            onpropertychange={handlePropertyChange}
                                        ></c-fgrid_property-controls>
                                    </lightning-accordion-section>
                                </template>
                            </lightning-accordion>
                        </template>
                    </lightning-tab>
                </lightning-tabset>
            </div>

            <!-- ===================== center: the preview ===================== -->
            <div class="studio__preview">
                <!-- A drop target for fields dragged from the Fields tab. -->
                <div
                    class={previewClass}
                    ondragover={handlePreviewDragOver}
                    ondragleave={handlePreviewDragLeave}
                    ondrop={handlePreviewDrop}
                >
                    <div class="preview__chrome">
                        <div class={previewBannerClass}>
                            <lightning-icon icon-name={previewBannerIcon} size="x-small"></lightning-icon>
                            <span class="slds-m-left_xx-small">{previewBannerText}</span>
                        </div>

                        <lightning-combobox
                            class="preview__size"
                            label="Preview Size"
                            variant="label-inline"
                            value={previewSize}
                            options={previewSizeOptions}
                            field-level-help="Renders the preview at the width of a small, medium or large modal, so you can see how the grid behaves in a narrow container before the flow runs."
                            onchange={handlePreviewSizeChange}
                        ></lightning-combobox>
                    </div>

                    <template lwc:if={hasColumns}>
                        <div class="preview__frame" style={previewFrameStyle}>
                            <!-- Same toolbar shape as the runtime grid: title left,
                         search right. The search is inert; filters are not —
                         the preview holds real records, so filtering them
                         shows the actual behavior. -->
                            <template lwc:if={showPreviewToolbar}>
                                <div class="preview__header">
                                    <template lwc:if={showPreviewHeader}>
                                        <template lwc:if={hasPreviewHeaderIcon}>
                                            <lightning-icon
                                                icon-name={previewHeaderIcon}
                                                size="small"
                                                class="slds-m-right_x-small"
                                            ></lightning-icon>
                                        </template>
                                        <div class="preview__header-text">
                                            <h2 class="slds-text-heading_small">{previewHeaderLabel}</h2>
                                            <template lwc:if={hasPreviewCountLabel}>
                                                <p class="slds-text-body_small slds-text-color_weak">
                                                    {previewCountLabel}
                                                </p>
                                            </template>
                                        </div>
                                    </template>

                                    <div class="preview__toolbar-actions">
                                        <template lwc:if={showSearchBar}>
                                            <div class="preview__search">
                                                <lightning-input
                                                    type="search"
                                                    variant="label-hidden"
                                                    label="Search"
                                                    placeholder="Search…"
                                                    disabled
                                                ></lightning-input>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </template>

                            <template lwc:if={hasPreviewFilters}>
                                <div class="preview__pills">
                                    <span class="preview__pills-label">Filters</span>
                                    <template for:each={previewFilterPills} for:item="pill">
                                        <span class="preview__pill" key={pill.path}>
                                            <button
                                                type="button"
                                                class="preview__pill-label"
                                                data-path={pill.path}
                                                title="Edit this filter"
                                                onclick={handleEditPreviewPill}
                                            >
                                                {pill.label}
                                            </button>
                                            <lightning-button-icon
                                                icon-name="utility:close"
                                                variant="bare"
                                                size="xx-small"
                                                alternative-text="Remove this filter"
                                                title="Remove this filter"
                                                data-path={pill.path}
                                                onclick={handleRemovePreviewPill}
                                            ></lightning-button-icon>
                                        </span>
                                    </template>
                                    <lightning-button
                                        variant="base"
                                        label="Clear all"
                                        onclick={handleClearPreviewFilters}
                                    ></lightning-button>
                                </div>
                            </template>

                            <div class="preview__grid slds-is-relative" style={previewGridStyle}>
                                <!-- Where a dragged field will land: between two columns. -->
                                <template lwc:if={dropIndicatorStyle}>
                                    <div class="preview__drop" style={dropIndicatorStyle} aria-hidden="true"></div>
                                </template>
                                <template lwc:if={isFirstSamplePending}>
                                    <lightning-spinner
                                        alternative-text="Loading a sample of your records"
                                        size="small"
                                    ></lightning-spinner>
                                </template>
                                <template lwc:else>
                                    <!-- The subclass, not the base datatable: a column
                             config that enables editing on a picklist emits
                             a custom cell type, which a plain
                             lightning-datatable cannot render. -->
                                    <c-fgrid_custom-datatable
                                        key-field={previewKeyField}
                                        columns={previewColumns}
                                        data={previewRows}
                                        hide-checkbox-column={previewHideCheckbox}
                                        max-row-selection={previewMaxRowSelection}
                                        show-row-number-column={values.showRowNumbers}
                                        min-column-width={previewMinColumnWidth}
                                        wrap-table-header="by-column"
                                        wrap-text-max-lines={previewWrappedLines}
                                        onheaderaction={handlePreviewHeaderAction}
                                        suppress-bottom-bar
                                    ></c-fgrid_custom-datatable>
                                </template>
                            </div>

                            <template lwc:if={showPaginationChrome}>
                                <div class="preview__pagination">
                                    <template lwc:if={showFirstLast}>
                                        <lightning-button label="First" disabled></lightning-button>
                                    </template>
                                    <lightning-button label="Previous" disabled></lightning-button>
                                    <lightning-button label="Next" disabled></lightning-button>
                                    <template lwc:if={showFirstLast}>
                                        <lightning-button label="Last" disabled></lightning-button>
                                    </template>
                                </div>
                            </template>

                            <template lwc:if={hasRowAction}>
                                <p class="preview__note">{rowActionSummary}</p>
                            </template>
                        </div>
                    </template>

                    <template lwc:else>
                        <div class="preview__empty">
                            <lightning-icon icon-name="utility:table" size="large" variant="inverse"></lightning-icon>
                            <p class="slds-m-top_small">
                                Choose a record collection and some columns to see a preview.
                            </p>
                        </div>
                    </template>
                </div>
            </div>

            <!-- ============== right: the inspector (layout C) ==============
                 Flow Builder's own properties panel, borrowed so the Studio
                 fits in: the SLDS Panel blueprint docked right, a header with a
                 resize button, and a tabset. No tab icons: at 20rem three tabs with
                 icons overflow, and the tabset hides the third under More. Medium is
                 20rem and expanded is x-large, 40rem, as in Flow Builder.
                 Errors sit above the tabs and each names the tab that fixes it;
                 a tab with one shows Flow's own error indicator. Each tab renders
                 its content only while it is the active one. -->
            <div class={inspectorClass}>
                <div class="slds-panel__header slds-truncate_container">
                    <div class="slds-col slds-truncate">
                        <h2
                            class="slds-panel__header-title slds-text-heading_small slds-truncate"
                            title="Grid Settings"
                        >
                            Grid Settings
                        </h2>
                    </div>
                    <lightning-button-icon
                        class="inspector__expand"
                        size="small"
                        variant="container"
                        icon-name={expandIcon}
                        alternative-text="Resize panel"
                        title="Resize panel"
                        aria-expanded={inspectorExpandedLabel}
                        onclick={handleToggleExpand}
                    ></lightning-button-icon>
                </div>

                <div
                    class="slds-panel__body slds-scrollable_y slds-p-around_none slds-grid slds-grid_vertical slds-grow inspector__body"
                >
                    <template lwc:if={hasValidationErrors}>
                        <div class="inspector__errors" role="alert">
                            <p class="slds-text-title_bold">Fix the following:</p>
                            <ul class="slds-list_dotted">
                                <template for:each={errorList} for:item="error">
                                    <li key={error.key}>
                                        {error.errorString}
                                        <template lwc:if={error.tab}>
                                            <button
                                                type="button"
                                                class="inspector__error-link"
                                                data-tab={error.tab}
                                                onclick={handleSelectTab}
                                            >
                                                {error.where}
                                            </button>
                                        </template>
                                    </li>
                                </template>
                            </ul>
                        </div>
                    </template>

                    <lightning-tabset class="inspector__tabs" active-tab-value={currentTab}>
                        <lightning-tab
                            label="Table"
                            value="table"
                            show-error-indicator={tableTabHasErrors}
                            onactive={handleTabActive}
                        >
                            <template lwc:if={isTableTab}>
                                <lightning-accordion allow-multiple-sections-open active-section-name={openSections}>
                                    <template for:each={tabSections} for:item="section">
                                        <lightning-accordion-section
                                            key={section.name}
                                            name={section.name}
                                            label={section.label}
                                        >
                                            <c-fgrid_property-controls
                                                section={section}
                                                values={values}
                                                value-data-types={valueDataTypes}
                                                object-api-name={objectApiName}
                                                builder-context={builderContext}
                                                automatic-output-variables={automaticOutputVariables}
                                                api-version={apiVersion}
                                                onpropertychange={handlePropertyChange}
                                            ></c-fgrid_property-controls>
                                        </lightning-accordion-section>
                                    </template>
                                </lightning-accordion>
                            </template>
                        </lightning-tab>
                        <lightning-tab
                            label="Columns"
                            value="columns"
                            show-error-indicator={columnsTabHasErrors}
                            onactive={handleTabActive}
                        >
                            <template lwc:if={isColumnsTab}>
                                <div class="inspector__columns">
                                    <!-- Choosing columns sits on top of the list it changes. -->
                                    <template for:each={tabSections} for:item="section">
                                        <div key={section.name} class="inspector__block">
                                            <c-fgrid_property-controls
                                                section={section}
                                                values={values}
                                                value-data-types={valueDataTypes}
                                                object-api-name={objectApiName}
                                                builder-context={builderContext}
                                                automatic-output-variables={automaticOutputVariables}
                                                api-version={apiVersion}
                                                onpropertychange={handlePropertyChange}
                                            ></c-fgrid_property-controls>
                                        </div>
                                    </template>
                                    <div class="inspector__block">
                                        <template lwc:if={canConfigureColumns}>
                                            <c-fgrid_column-config
                                                column-fields={values.columnFields}
                                                column-config={values.columnConfig}
                                                object-api-name={objectApiName}
                                                describe-by-path={describeByPath}
                                                oncolumnconfigchange={handleColumnConfigChange}
                                            ></c-fgrid_column-config>
                                        </template>
                                        <template lwc:else>
                                            <p class="slds-text-body_small slds-text-color_weak">
                                                Choose a record collection on the Data tab first — columns come from
                                                that object.
                                            </p>
                                        </template>
                                    </div>
                                </div>
                            </template>
                        </lightning-tab>
                    </lightning-tabset>
                </div>
            </div>
        </div>

        <template lwc:if={isPreviewFilterEditorOpen}>
            <c-fgrid_filter-editor
                column={previewFilterEditorColumn}
                filter={previewFilterEditorFilter}
                suppress-backdrop
                onfiltersave={handlePreviewFilterSave}
                onfilterremove={handlePreviewFilterRemove}
                onfilterclose={handlePreviewFilterEditorClose}
            ></c-fgrid_filter-editor>
        </template>
    </lightning-modal-body>

    <lightning-modal-footer>
        <lightning-button variant="brand" label="Done" onclick={handleClose}></lightning-button>
    </lightning-modal-footer>
</template>
