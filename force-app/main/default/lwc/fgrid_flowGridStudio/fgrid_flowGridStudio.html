<template>
    <!-- The header, footer, close button, backdrop, focus trap and Escape handling
         all belong to lightning/modal now. The tagline goes between the header
         tags, which is where the component documents it should live. -->
    <lightning-modal-header label="Grid Studio">
        <p class="slds-m-top_x-small slds-text-body_small">
            Changes apply immediately and are saved with the Flow element.
        </p>
    </lightning-modal-header>

    <lightning-modal-body>
        <div class={contentClass}>
            <!-- ==================== left: controls ==================== -->
            <div class="studio__controls">
                <template lwc:if={hasValidationErrors}>
                    <div class="slds-box slds-box_x-small slds-theme_error slds-m-bottom_x-small" role="alert">
                        <p class="slds-text-title_bold slds-m-bottom_xx-small">Fix the following:</p>
                        <ul class="slds-list_dotted">
                            <template for:each={validationErrors} for:item="error">
                                <li key={error.key}>{error.errorString}</li>
                            </template>
                        </ul>
                    </div>
                </template>

                <lightning-accordion allow-multiple-sections-open active-section-name={openSections}>
                    <template for:each={sections} for:item="section">
                        <lightning-accordion-section key={section.name} name={section.name} label={section.label}>
                            <c-fgrid_property-controls
                                section={section}
                                values={values}
                                value-data-types={valueDataTypes}
                                object-api-name={objectApiName}
                                builder-context={builderContext}
                                automatic-output-variables={automaticOutputVariables}
                                api-version={apiVersion}
                                onpropertychange={handlePropertyChange}
                            ></c-fgrid_property-controls>
                        </lightning-accordion-section>
                    </template>
                </lightning-accordion>
            </div>

            <!-- ================= right: preview + columns ============== -->
            <div class="studio__preview">
                <div class="preview">
                    <!-- The toggle leads the banner row so it holds the same spot
                         whether the settings pane is showing or not. -->
                    <div class="preview__chrome">
                        <lightning-button-icon
                            icon-name={sidebarToggleIcon}
                            variant="border-filled"
                            size="small"
                            alternative-text={sidebarToggleLabel}
                            title={sidebarToggleLabel}
                            aria-expanded={sidebarExpanded}
                            onclick={handleToggleSidebar}
                        ></lightning-button-icon>
                        <div class={previewBannerClass}>
                            <lightning-icon icon-name={previewBannerIcon} size="x-small"></lightning-icon>
                            <span class="slds-m-left_xx-small">{previewBannerText}</span>
                        </div>

                        <lightning-combobox
                            class="preview__size"
                            label="Preview Size"
                            variant="label-inline"
                            value={previewSize}
                            options={previewSizeOptions}
                            field-level-help="Renders the preview at the width of a small, medium or large modal, so you can see how the grid behaves in a narrow container before the flow runs."
                            onchange={handlePreviewSizeChange}
                        ></lightning-combobox>
                    </div>

                    <template lwc:if={hasColumns}>
                        <div class="preview__frame" style={previewFrameStyle}>
                            <!-- Same toolbar shape as the runtime grid: title left,
                         search right. The search is inert; filters are not —
                         the preview holds real records, so filtering them
                         shows the actual behaviour. -->
                            <template lwc:if={showPreviewToolbar}>
                                <div class="preview__header">
                                    <template lwc:if={showPreviewHeader}>
                                        <template lwc:if={hasPreviewHeaderIcon}>
                                            <lightning-icon
                                                icon-name={previewHeaderIcon}
                                                size="small"
                                                class="slds-m-right_x-small"
                                            ></lightning-icon>
                                        </template>
                                        <div class="preview__header-text">
                                            <template lwc:if={previewTitleIsHeading}>
                                                <div
                                                    role="heading"
                                                    aria-level={previewTitleAriaLevel}
                                                    style={previewTitleStyleCss}
                                                >
                                                    {previewHeaderLabel}
                                                </div>
                                            </template>
                                            <template lwc:else>
                                                <p style={previewTitleStyleCss}>{previewHeaderLabel}</p>
                                            </template>
                                            <template lwc:if={hasPreviewCountLabel}>
                                                <p class="slds-text-body_small slds-text-color_weak">
                                                    {previewCountLabel}
                                                </p>
                                            </template>
                                        </div>
                                    </template>

                                    <div class="preview__toolbar-actions">
                                        <template lwc:if={showSearchBar}>
                                            <div class="preview__search">
                                                <lightning-input
                                                    type="search"
                                                    variant="label-hidden"
                                                    label="Search"
                                                    placeholder="Search…"
                                                    disabled
                                                ></lightning-input>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </template>

                            <template lwc:if={hasPreviewFilters}>
                                <div class="preview__pills">
                                    <span class="preview__pills-label">Filters</span>
                                    <template for:each={previewFilterPills} for:item="pill">
                                        <span class="preview__pill" key={pill.path}>
                                            <button
                                                type="button"
                                                class="preview__pill-label"
                                                data-path={pill.path}
                                                title="Edit this filter"
                                                onclick={handleEditPreviewPill}
                                            >
                                                {pill.label}
                                            </button>
                                            <lightning-button-icon
                                                icon-name="utility:close"
                                                variant="bare"
                                                size="xx-small"
                                                alternative-text="Remove this filter"
                                                title="Remove this filter"
                                                data-path={pill.path}
                                                onclick={handleRemovePreviewPill}
                                            ></lightning-button-icon>
                                        </span>
                                    </template>
                                    <lightning-button
                                        variant="base"
                                        label="Clear all"
                                        onclick={handleClearPreviewFilters}
                                    ></lightning-button>
                                </div>
                            </template>

                            <div class="preview__grid" style={previewGridStyle}>
                                <!-- The subclass, not the base datatable: a column
                             config that enables editing on a picklist emits
                             a custom cell type, which a plain
                             lightning-datatable cannot render. -->
                                <c-fgrid_custom-datatable
                                    key-field={previewKeyField}
                                    columns={previewColumns}
                                    data={previewRows}
                                    hide-checkbox-column={previewHideCheckbox}
                                    max-row-selection={previewMaxRowSelection}
                                    show-row-number-column={values.showRowNumbers}
                                    min-column-width={previewMinColumnWidth}
                                    wrap-table-header="by-column"
                                    wrap-text-max-lines={previewWrappedLines}
                                    onheaderaction={handlePreviewHeaderAction}
                                    suppress-bottom-bar
                                ></c-fgrid_custom-datatable>
                            </div>

                            <template lwc:if={showPaginationChrome}>
                                <div class="preview__pagination">
                                    <template lwc:if={showFirstLast}>
                                        <lightning-button label="First" disabled></lightning-button>
                                    </template>
                                    <lightning-button label="Previous" disabled></lightning-button>
                                    <lightning-button label="Next" disabled></lightning-button>
                                    <template lwc:if={showFirstLast}>
                                        <lightning-button label="Last" disabled></lightning-button>
                                    </template>
                                </div>
                            </template>

                            <template lwc:if={hasRowAction}>
                                <p class="preview__note">{rowActionSummary}</p>
                            </template>
                        </div>
                    </template>

                    <template lwc:else>
                        <div class="preview__empty">
                            <lightning-icon icon-name="utility:table" size="large" variant="inverse"></lightning-icon>
                            <p class="slds-m-top_small">
                                Choose a record collection and some columns to see a preview.
                            </p>
                        </div>
                    </template>
                </div>

                <div class="studio__columns">
                    <h3 class="slds-text-heading_small slds-m-bottom_x-small">Column attributes</h3>
                    <template lwc:if={hasObject}>
                        <c-fgrid_column-config
                            column-fields={values.columnFields}
                            column-config={values.columnConfig}
                            object-api-name={objectApiName}
                            describe-by-path={describeByPath}
                            oncolumnconfigchange={handleColumnConfigChange}
                        ></c-fgrid_column-config>
                    </template>
                    <template lwc:else>
                        <p class="slds-text-body_small slds-text-color_weak">
                            Choose a record collection in Data Source first — columns come from that object.
                        </p>
                    </template>
                </div>
            </div>
        </div>

        <template lwc:if={isPreviewFilterEditorOpen}>
            <c-fgrid_filter-editor
                column={previewFilterEditorColumn}
                filter={previewFilterEditorFilter}
                suppress-backdrop
                onfiltersave={handlePreviewFilterSave}
                onfilterremove={handlePreviewFilterRemove}
                onfilterclose={handlePreviewFilterEditorClose}
            ></c-fgrid_filter-editor>
        </template>
    </lightning-modal-body>

    <lightning-modal-footer>
        <lightning-button variant="brand" label="Done" onclick={handleClose}></lightning-button>
    </lightning-modal-footer>
</template>
