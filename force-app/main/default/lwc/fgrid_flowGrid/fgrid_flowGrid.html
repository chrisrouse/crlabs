<template>
    <div class="grid">
        <!-- Field metadata could not be loaded: a configuration problem, not a
             reason to render nothing. -->
        <template lwc:if={hasError}>
            <div class="slds-box slds-box_x-small slds-theme_error slds-m-bottom_x-small" role="alert">
                <p>{errorMessage}</p>
            </div>
        </template>

        <!-- Columns the running user cannot read. Named explicitly rather than
             silently dropped, so the gap is diagnosable. -->
        <template lwc:if={hasInaccessibleColumns}>
            <div class="slds-box slds-box_x-small slds-theme_warning slds-m-bottom_x-small" role="alert">
                <ul class="slds-list_dotted">
                    <template for:each={inaccessibleColumns} for:item="message">
                        <li key={message}>{message}</li>
                    </template>
                </ul>
            </div>
        </template>

        <template lwc:if={showHeader}>
            <div class="grid__header">
                <template lwc:if={hasHeaderIcon}>
                    <lightning-icon icon-name={headerIcon} size="small" class="slds-m-right_x-small"></lightning-icon>
                </template>
                <div class="grid__header-text">
                    <h2 class="slds-text-heading_small">{headerLabel}</h2>
                    <template lwc:if={hasHeaderCounts}>
                        <p class="slds-text-body_small slds-text-color_weak">{headerCounts}</p>
                    </template>
                </div>
                <template lwc:if={showClearSelection}>
                    <lightning-button
                        variant="neutral"
                        label="Clear Selection"
                        onclick={handleClearSelection}
                    ></lightning-button>
                </template>
            </div>
        </template>

        <template lwc:if={hasColumns}>
            <template lwc:if={showSearchBar}>
                <div class="grid__search">
                    <lightning-input
                        type="search"
                        variant="label-hidden"
                        label="Search records"
                        placeholder="Search records..."
                        value={searchTerm}
                        onchange={handleSearch}
                    ></lightning-input>
                </div>
            </template>

            <template lwc:if={showFilterBar}>
                <div class="grid__filters">
                    <template for:each={filterInputs} for:item="filter">
                        <div class="grid__filter" key={filter.key}>
                            <lightning-input
                                type="search"
                                label={filter.label}
                                data-path={filter.path}
                                value={filter.value}
                                onchange={handleFilterChange}
                            ></lightning-input>
                        </div>
                    </template>
                </div>
            </template>

            <template lwc:if={hasActiveFilters}>
                <div class="grid__filter-actions">
                    <lightning-button
                        variant="base"
                        label="Clear Filters"
                        icon-name="utility:clear"
                        onclick={handleClearFilters}
                    ></lightning-button>
                </div>
            </template>

            <template lwc:if={hasRemovalBlockedMessage}>
                <div class="slds-box slds-box_x-small slds-theme_warning slds-m-bottom_x-small" role="alert">
                    <p>{removalBlockedMessage}</p>
                </div>
            </template>

            <template lwc:if={hasRows}>
                <div class={wrapperClass} style={wrapperStyle}>
                    <lightning-datatable
                        key-field={keyField}
                        columns={columns}
                        data={rows}
                        selected-rows={selectedRowKeys}
                        max-row-selection={maxRowSelection}
                        hide-checkbox-column={hideCheckboxColumn}
                        show-row-number-column={showRowNumbers}
                        sorted-by={sortedBy}
                        sorted-direction={sortDirection}
                        onrowselection={handleRowSelection}
                        onsort={handleSort}
                        onrowaction={handleRowAction}
                        suppress-bottom-bar
                    ></lightning-datatable>
                </div>

                <template lwc:if={showPaginationBar}>
                    <div class="grid__pagination">
                        <span class="grid__page-summary">{pageSummary}</span>
                        <div class="grid__page-buttons">
                            <template lwc:if={showFirstLastButtons}>
                                <lightning-button
                                    label="First"
                                    disabled={isFirstPage}
                                    onclick={handleFirstPage}
                                ></lightning-button>
                            </template>
                            <lightning-button
                                label="Previous"
                                disabled={isFirstPage}
                                onclick={handlePreviousPage}
                            ></lightning-button>
                            <lightning-button
                                label="Next"
                                disabled={isLastPage}
                                onclick={handleNextPage}
                            ></lightning-button>
                            <template lwc:if={showFirstLastButtons}>
                                <lightning-button
                                    label="Last"
                                    disabled={isLastPage}
                                    onclick={handleLastPage}
                                ></lightning-button>
                            </template>
                        </div>
                    </div>
                </template>

                <!-- Clear Selection lives in the header when one is shown. -->
                <template lwc:if={showHeader}></template>
                <template lwc:else>
                    <template lwc:if={showClearSelection}>
                        <div class="grid__footer">
                            <lightning-button
                                variant="base"
                                label="Clear Selection"
                                onclick={handleClearSelection}
                            ></lightning-button>
                        </div>
                    </template>
                </template>
            </template>

            <template lwc:else>
                <div class="grid__empty">
                    <lightning-icon icon-name="utility:table" size="small" variant="inverse"></lightning-icon>
                    <template lwc:if={isFilteredEmpty}>
                        <p class="slds-m-top_x-small">No records match your search or filters.</p>
                        <lightning-button
                            variant="base"
                            label="Clear Search and Filters"
                            onclick={handleClearFilters}
                        ></lightning-button>
                    </template>
                    <template lwc:else>
                        <p class="slds-m-top_x-small">No records to display.</p>
                    </template>
                </div>
            </template>
        </template>

        <template lwc:else>
            <div class="grid__empty">
                <p>No columns are configured for this grid.</p>
            </div>
        </template>

        <template lwc:if={hasValidationMessage}>
            <p class="grid__validation" role="alert">{validationMessage}</p>
        </template>

        <template lwc:if={isRunningFlow}>
            <div class="grid__running" role="status">
                <lightning-spinner alternative-text="Running flow" size="small" variant="brand"></lightning-spinner>
                <span class="slds-m-left_small slds-text-body_small">Running flow…</span>
            </div>
        </template>

        <template lwc:if={hasFlowError}>
            <div class="slds-box slds-box_x-small slds-theme_warning slds-m-top_x-small" role="alert">
                <p>{flowError}</p>
            </div>
        </template>
    </div>

    <!-- Row-action flow. Launched in place of the four-component chain the
         predecessor required: the grid passes the clicked record in, reads the
         result out, and upserts it by key. -->
    <template lwc:if={isFlowOpen}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-label={flowModalHeader} class={flowModalClass}>
            <div class="slds-modal__container">
                <header class="slds-modal__header grid__flow-header">
                    <lightning-button-icon
                        icon-name="utility:close"
                        alternative-text="Close"
                        title="Close"
                        variant="bare"
                        class="grid__flow-close"
                        onclick={handleCloseFlow}
                    ></lightning-button-icon>
                    <h2 class="slds-text-heading_medium slds-hyphenate">{flowModalHeader}</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-flow
                        flow-api-name={flowApiName}
                        flow-input-variables={flowInputVariables}
                        onstatuschange={handleFlowStatusChange}
                    ></lightning-flow>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
