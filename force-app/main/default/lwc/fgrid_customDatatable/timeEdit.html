<!-- lightning-input type="time" emits exactly the `HH:mm:ss.SSSZ` form Apex uses for
     a Time field, so the value round-trips with no conversion on either side.

     data-inputable="true" is how the inline-edit machinery reads the committed
     value. Load-bearing; see fgrid_customDatatable. -->
<template>
    <lightning-input
        type="time"
        label={columnLabel}
        variant="label-hidden"
        value={editedValue}
        required={required}
        data-inputable="true"
    ></lightning-input>
</template>
