<template>
    <template lwc:if={hasFields}>
        <!-- ===================== Compact: narrow panel =====================
             A count only. This used to list every column with its configured
             attributes, which grew a full screen tall on a real grid and pushed
             the rest of the panel out of reach. The detail belongs in the Studio's
             editable table, which is one click away. -->
        <template lwc:if={compact}>
            <div class="summary">
                <p class="slds-text-title_caps">{countLabel}</p>
            </div>
        </template>

        <!-- ====================== Full: Grid Studio ======================== -->
        <template lwc:else>
            <div class="grid">
                <div class="grid__toolbar">
                    <span class="slds-text-title_caps">{countLabel}</span>
                    <lightning-button
                        variant="base"
                        label="Reset all attributes"
                        onclick={handleClearAll}
                    ></lightning-button>
                </div>

                <table class="slds-table slds-table_bordered slds-table_fixed-layout grid__table">
                    <thead>
                        <tr class="slds-line-height_reset">
                            <th class="grid__col-num" scope="col"><div class="slds-truncate">#</div></th>
                            <th class="grid__col-field" scope="col"><div class="slds-truncate">Field</div></th>
                            <th class="grid__col-label" scope="col"><div class="slds-truncate">Label</div></th>
                            <th class="grid__col-width" scope="col">
                                <div class="slds-truncate">Width</div>
                                <!-- Offered rather than applied automatically: a resize
                                     reports every column, and writing them all would pin
                                     the lot the moment one was dragged. -->
                                <div class="grid__width-actions">
                                    <template lwc:if={hasCapturableWidths}>
                                        <lightning-button
                                            variant="base"
                                            label="Capture"
                                            title="Use the widths you dragged in the preview"
                                            onclick={handleCaptureWidths}
                                        ></lightning-button>
                                    </template>
                                    <template lwc:if={hasAnyWidth}>
                                        <lightning-button
                                            variant="base"
                                            label="Auto"
                                            title="Clear every width back to auto"
                                            onclick={handleResetWidths}
                                        ></lightning-button>
                                    </template>
                                </div>
                            </th>
                            <th class="grid__col-align" scope="col"><div class="slds-truncate">Align</div></th>
                            <th class="grid__col-flag" scope="col">
                                <div class="slds-truncate" title="Editable">Edit</div>
                            </th>
                            <th class="grid__col-flag" scope="col">
                                <div class="slds-truncate" title="Filterable">Filter</div>
                            </th>
                            <th class="grid__col-flag" scope="col">
                                <div class="slds-truncate" title="Wrap this column's cells and its header">Wrap</div>
                            </th>
                            <th class="grid__col-actions" scope="col"><div class="slds-truncate">&nbsp;</div></th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={rows} for:item="row">
                            <tr key={row.key} class="slds-hint-parent">
                                <td class="grid__cell-num">{row.position}</td>
                                <td>
                                    <div class="slds-truncate grid__field" title={row.field}>{row.field}</div>
                                </td>
                                <td>
                                    <lightning-input
                                        type="text"
                                        variant="label-hidden"
                                        label="Label"
                                        data-field={row.field}
                                        data-attribute="label"
                                        placeholder="Default"
                                        max-length="255"
                                        value={row.label}
                                        onchange={handleTextChange}
                                    ></lightning-input>
                                </td>
                                <td>
                                    <lightning-input
                                        type="number"
                                        variant="label-hidden"
                                        label="Width"
                                        data-field={row.field}
                                        data-attribute="width"
                                        placeholder="auto"
                                        min="20"
                                        value={row.width}
                                        onchange={handleNumberChange}
                                    ></lightning-input>
                                </td>
                                <td>
                                    <lightning-combobox
                                        variant="label-hidden"
                                        label="Align"
                                        data-field={row.field}
                                        data-attribute="align"
                                        value={row.align}
                                        options={alignmentOptions}
                                        onchange={handleSelectChange}
                                    ></lightning-combobox>
                                </td>
                                <td class="grid__cell-flag">
                                    <lightning-input
                                        type="checkbox"
                                        variant="label-hidden"
                                        label="Editable"
                                        data-field={row.field}
                                        data-attribute="edit"
                                        checked={row.edit}
                                        onchange={handleCheckboxChange}
                                    ></lightning-input>
                                </td>
                                <td class="grid__cell-flag">
                                    <lightning-input
                                        type="checkbox"
                                        variant="label-hidden"
                                        label="Filterable"
                                        data-field={row.field}
                                        data-attribute="filter"
                                        checked={row.filter}
                                        onchange={handleCheckboxChange}
                                    ></lightning-input>
                                </td>
                                <td class="grid__cell-flag">
                                    <lightning-input
                                        type="checkbox"
                                        variant="label-hidden"
                                        label="Wrap text"
                                        data-field={row.field}
                                        data-attribute="wrap"
                                        checked={row.wrap}
                                        onchange={handleDefaultOnFlagChange}
                                    ></lightning-input>
                                </td>
                                <td class="grid__cell-actions">
                                    <lightning-button
                                        variant="base"
                                        label={row.expandLabel}
                                        data-field={row.field}
                                        onclick={handleToggleAdvanced}
                                    ></lightning-button>
                                </td>
                            </tr>

                            <template lwc:if={row.isExpanded}>
                                <tr key={row.field} class="grid__advanced">
                                    <td colspan="10">
                                        <div class="advanced">
                                            <!-- Lookup-only, and mirroring the
                                                 standard datatable's Display
                                                 Options. Both default on, so the
                                                 stored attribute is only ever an
                                                 explicit opt-out. -->
                                            <template lwc:if={row.isLookup}>
                                                <div class="advanced__col">
                                                    <p class="slds-text-title_bold slds-m-bottom_xx-small">
                                                        Display Options
                                                    </p>
                                                    <lightning-input
                                                        type="checkbox"
                                                        label="Show record name"
                                                        data-field={row.field}
                                                        data-attribute="showName"
                                                        checked={row.showName}
                                                        field-level-help="Show the related record's name instead of its Id. The name is read from the record, so the Flow's Get Records must have queried the relationship — otherwise the Id is shown."
                                                        onchange={handleDefaultOnFlagChange}
                                                    ></lightning-input>
                                                    <lightning-input
                                                        type="checkbox"
                                                        label="Link to record"
                                                        data-field={row.field}
                                                        data-attribute="link"
                                                        checked={row.link}
                                                        field-level-help="Make the text a link to the related record. The link opens the record; the edit pencil still edits the cell."
                                                        onchange={handleDefaultOnFlagChange}
                                                    ></lightning-input>
                                                    <template lwc:if={row.isPolymorphic}>
                                                        <p
                                                            class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small"
                                                        >
                                                            This lookup points at more than one object, so it cannot be
                                                            edited in the grid.
                                                        </p>
                                                    </template>
                                                </div>
                                            </template>
                                            <div class="advanced__col">
                                                <c-fgrid_icon-picker
                                                    label="Column icon"
                                                    data-field={row.field}
                                                    data-attribute="icon"
                                                    value={row.icon}
                                                    oniconchange={handleIconChange}
                                                ></c-fgrid_icon-picker>
                                            </div>
                                            <div class="advanced__col">
                                                <lightning-input
                                                    type="number"
                                                    label="Decimal places"
                                                    data-field={row.field}
                                                    data-attribute="scale"
                                                    min="0"
                                                    max="10"
                                                    value={row.scale}
                                                    field-level-help="Digits shown after the decimal point for currency, number, and percent columns."
                                                    onchange={handleNumberChange}
                                                ></lightning-input>
                                                <lightning-input
                                                    type="number"
                                                    label="Edit step"
                                                    data-field={row.field}
                                                    data-attribute="step"
                                                    step="0.001"
                                                    value={row.step}
                                                    field-level-help="Smallest increment when editing a currency, number, or percent cell. Defaults to 0.01, which silently rounds a value needing more precision."
                                                    onchange={handleNumberChange}
                                                ></lightning-input>
                                                <lightning-input
                                                    type="checkbox"
                                                    label="Turn URLs into links"
                                                    data-field={row.field}
                                                    data-attribute="linkify"
                                                    checked={row.linkify}
                                                    field-level-help="Detects URLs inside a plain text cell and renders them as links."
                                                    onchange={handleCheckboxChange}
                                                ></lightning-input>
                                                <lightning-input
                                                    type="text"
                                                    label="Field type override"
                                                    data-field={row.field}
                                                    data-attribute="type"
                                                    value={row.type}
                                                    placeholder="text"
                                                    field-level-help="Only needed for a user-defined object, where Flow Grid cannot describe the field."
                                                    onchange={handleTextChange}
                                                ></lightning-input>
                                            </div>
                                            <div class="advanced__col advanced__col_wide">
                                                <lightning-textarea
                                                    label="Cell attributes (JSON)"
                                                    data-field={row.field}
                                                    data-attribute="cellAttribs"
                                                    value={row.cellAttribs}
                                                    placeholder={cellAttribsPlaceholder}
                                                    onchange={handleBlobChange}
                                                ></lightning-textarea>
                                                <lightning-textarea
                                                    label="Type attributes (JSON)"
                                                    data-field={row.field}
                                                    data-attribute="typeAttribs"
                                                    value={row.typeAttribs}
                                                    placeholder={typeAttribsPlaceholder}
                                                    onchange={handleBlobChange}
                                                ></lightning-textarea>
                                                <lightning-textarea
                                                    label="Other attributes (JSON)"
                                                    data-field={row.field}
                                                    data-attribute="otherAttribs"
                                                    value={row.otherAttribs}
                                                    placeholder={otherAttribsPlaceholder}
                                                    onchange={handleBlobChange}
                                                ></lightning-textarea>
                                            </div>
                                        </div>
                                        <div class="advanced__footer">
                                            <lightning-button
                                                variant="destructive-text"
                                                label="Reset this column"
                                                data-field={row.field}
                                                onclick={handleClearColumn}
                                            ></lightning-button>
                                        </div>
                                    </td>
                                </tr>
                            </template>
                        </template>
                    </tbody>
                </table>
            </div>
        </template>
    </template>

    <template lwc:else>
        <p class="slds-text-body_small slds-text-color_weak">Select columns first; their attributes appear here.</p>
    </template>
</template>
