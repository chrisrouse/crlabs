<template>
    <template lwc:if={hasFields}>
        <!-- ===================== Compact: narrow panel =====================
             A count only. This used to list every column with its configured
             attributes, which grew a full screen tall on a real grid and pushed
             the rest of the panel out of reach. The detail belongs in the Studio's
             editable table, which is one click away. -->
        <template lwc:if={compact}>
            <div class="summary">
                <p class="slds-text-title_caps">{countLabel}</p>
            </div>
        </template>

        <!-- ====================== Full: Grid Studio ========================
             Treatment C. The grid holds what you would compare ACROSS columns;
             the drawer holds what only makes sense for one. -->
        <template lwc:else>
            <div class="grid">
                <div class="grid__toolbar">
                    <span class="slds-text-title_caps">{countLabel}</span>
                    <lightning-button
                        variant="base"
                        label="Reset all attributes"
                        onclick={handleClearAll}
                    ></lightning-button>
                </div>

                <table class="slds-table slds-table_bordered slds-table_fixed-layout grid__table">
                    <thead>
                        <tr class="slds-line-height_reset">
                            <th class="grid__col-num" scope="col"><div class="slds-truncate">#</div></th>
                            <th class="grid__col-field" scope="col"><div class="slds-truncate">Field</div></th>
                            <th class="grid__col-label" scope="col"><div class="slds-truncate">Label</div></th>
                            <th class="grid__col-width" scope="col"><div class="slds-truncate">Width</div></th>
                            <th class="grid__col-align" scope="col"><div class="slds-truncate">Align</div></th>
                            <th class="grid__col-flag" scope="col">
                                <div class="slds-truncate" title="Editable">Edit</div>
                            </th>
                            <th class="grid__col-flag" scope="col">
                                <div class="slds-truncate" title="Filterable">Filter</div>
                            </th>
                            <th class="grid__col-flag" scope="col">
                                <div class="slds-truncate" title="Sortable">Sort</div>
                            </th>
                            <th class="grid__col-flag" scope="col">
                                <div class="slds-truncate" title="Wrap this column's cells and its header">Wrap</div>
                            </th>
                            <th class="grid__col-rules" scope="col"><div class="slds-truncate">Format</div></th>
                            <th class="grid__col-actions" scope="col"><div class="slds-truncate">&nbsp;</div></th>
                        </tr>
                    </thead>
                    <!-- ONE <tbody> PER ROW, on purpose. Each for:each iteration must
                         have a single root element; a row plus a conditional drawer
                         row is two, and LWC then failed to remove the first drawer
                         when a second opened. A table may contain many tbody
                         elements, so this is valid and costs nothing. -->
                    <template for:each={rows} for:item="row">
                        <tbody key={row.key}>
                            <tr class="slds-hint-parent">
                                <td class="grid__cell-num">{row.position}</td>
                                <td>
                                    <div class="slds-truncate grid__field" title={row.field}>{row.field}</div>
                                </td>
                                <td>
                                    <lightning-input
                                        type="text"
                                        variant="label-hidden"
                                        label="Label"
                                        data-field={row.field}
                                        data-attribute="label"
                                        placeholder="Default"
                                        value={row.label}
                                        onchange={handleTextChange}
                                    ></lightning-input>
                                </td>
                                <td>
                                    <lightning-input
                                        type="number"
                                        variant="label-hidden"
                                        label="Width"
                                        data-field={row.field}
                                        data-attribute="width"
                                        placeholder="Auto"
                                        value={row.width}
                                        onchange={handleNumberChange}
                                    ></lightning-input>
                                </td>
                                <td>
                                    <lightning-combobox
                                        variant="label-hidden"
                                        label="Alignment"
                                        data-field={row.field}
                                        data-attribute="align"
                                        value={row.align}
                                        options={alignmentOptions}
                                        onchange={handleSelectChange}
                                    ></lightning-combobox>
                                </td>
                                <td class="grid__cell-flag">
                                    <lightning-input
                                        type="checkbox"
                                        variant="label-hidden"
                                        label="Editable"
                                        data-field={row.field}
                                        data-attribute="edit"
                                        checked={row.edit}
                                        onchange={handleCheckboxChange}
                                    ></lightning-input>
                                </td>
                                <td class="grid__cell-flag">
                                    <lightning-input
                                        type="checkbox"
                                        variant="label-hidden"
                                        label="Filterable"
                                        data-field={row.field}
                                        data-attribute="filter"
                                        checked={row.filter}
                                        onchange={handleCheckboxChange}
                                    ></lightning-input>
                                </td>
                                <td class="grid__cell-flag">
                                    <lightning-input
                                        type="checkbox"
                                        variant="label-hidden"
                                        label="Sortable"
                                        data-field={row.field}
                                        data-attribute="sort"
                                        checked={row.sort}
                                        onchange={handleDefaultOnFlagChange}
                                    ></lightning-input>
                                </td>
                                <td class="grid__cell-flag">
                                    <lightning-input
                                        type="checkbox"
                                        variant="label-hidden"
                                        label="Wrap"
                                        data-field={row.field}
                                        data-attribute="wrap"
                                        checked={row.wrap}
                                        onchange={handleDefaultOnFlagChange}
                                    ></lightning-input>
                                </td>
                                <td>
                                    <!-- Read-only on purpose. A count says a column is
                                         formatted without pretending rules can be
                                         edited inside a table cell. -->
                                    <template lwc:if={row.hasRules}>
                                        <span class="grid__rules">{row.ruleCountLabel}</span>
                                    </template>
                                </td>
                                <td>
                                    <lightning-button
                                        variant="base"
                                        label={row.toggleLabel}
                                        data-field={row.field}
                                        onclick={handleToggleDrawer}
                                    ></lightning-button>
                                </td>
                            </tr>

                            <!-- ====================== the drawer ====================== -->
                            <template lwc:if={row.isOpen}>
                                <tr class="drawer">
                                    <td colspan="11">
                                        <div class="drawer__inner">
                                            <!-- ---------- Display ---------- -->
                                            <div class="drawer__section">
                                                <p class="drawer__title">Display</p>
                                                <div class="drawer__row">
                                                    <lightning-combobox
                                                        class="drawer__field"
                                                        label="Type"
                                                        field-level-help="What this value is displayed as. Only the types this field can sensibly use are offered."
                                                        data-field={row.field}
                                                        data-role="type"
                                                        value={row.type}
                                                        options={row.typeOptions}
                                                        onchange={handleTypeChange}
                                                    ></lightning-combobox>
                                                </div>
                                            </div>

                                            <!-- ---------- Numbers and currency ---------- -->
                                            <template lwc:if={row.isNumberGroup}>
                                                <div class="drawer__section drawer__typed">
                                                    <p class="drawer__typed-why">Because of this column's type</p>
                                                    <div class="drawer__row">
                                                        <lightning-input
                                                            class="drawer__field"
                                                            type="number"
                                                            label="Minimum decimals"
                                                            data-field={row.field}
                                                            data-attribute="minDecimals"
                                                            value={row.minDecimals}
                                                            onchange={handleNumberChange}
                                                        ></lightning-input>
                                                        <lightning-input
                                                            class="drawer__field"
                                                            type="number"
                                                            label="Maximum decimals"
                                                            data-field={row.field}
                                                            data-attribute="maxDecimals"
                                                            value={row.maxDecimals}
                                                            onchange={handleNumberChange}
                                                        ></lightning-input>
                                                        <lightning-input
                                                            class="drawer__field"
                                                            type="number"
                                                            label="Minimum whole digits"
                                                            data-field={row.field}
                                                            data-attribute="minIntegerDigits"
                                                            value={row.minIntegerDigits}
                                                            onchange={handleNumberChange}
                                                        ></lightning-input>
                                                        <lightning-input
                                                            class="drawer__field"
                                                            type="number"
                                                            label="Edit step"
                                                            step="0.001"
                                                            field-level-help="Smallest increment when editing. 0.01 permits two decimals; 1 whole numbers only. Defaults to 0.01, which silently rounds a value needing more precision."
                                                            data-field={row.field}
                                                            data-attribute="step"
                                                            value={row.step}
                                                            onchange={handleNumberChange}
                                                        ></lightning-input>
                                                    </div>
                                                    <template lwc:if={row.isCurrencyGroup}>
                                                        <div class="drawer__row">
                                                            <!-- Only in a multi-currency org. A code picker
                                                                 where there is one currency configures nothing. -->
                                                            <template lwc:if={row.showCurrencyCode}>
                                                                <lightning-combobox
                                                                    class="drawer__field"
                                                                    label="Currency code"
                                                                    data-field={row.field}
                                                                    data-attribute="currencyCode"
                                                                    value={row.currencyCode}
                                                                    options={row.currencyOptions}
                                                                    onchange={handleSelectChange}
                                                                ></lightning-combobox>
                                                            </template>
                                                            <lightning-combobox
                                                                class="drawer__field"
                                                                label="Show currency as"
                                                                data-field={row.field}
                                                                data-attribute="currencyDisplayAs"
                                                                value={row.currencyDisplayAs}
                                                                options={currencyDisplayOptions}
                                                                onchange={handleSelectChange}
                                                            ></lightning-combobox>
                                                        </div>
                                                    </template>
                                                </div>
                                            </template>

                                            <!-- ---------- Text ---------- -->
                                            <template lwc:if={row.isTextGroup}>
                                                <div class="drawer__section drawer__typed">
                                                    <p class="drawer__typed-why">Because this column is text</p>
                                                    <lightning-input
                                                        type="checkbox"
                                                        label="Turn URLs into links"
                                                        field-level-help="Detects URLs inside a plain text cell and renders them as links."
                                                        data-field={row.field}
                                                        data-attribute="linkify"
                                                        checked={row.linkify}
                                                        onchange={handleCheckboxChange}
                                                    ></lightning-input>
                                                </div>
                                            </template>

                                            <!-- ---------- Picklist ---------- -->
                                            <template lwc:if={row.isPicklistGroup}>
                                                <div class="drawer__section drawer__typed">
                                                    <p class="drawer__typed-why">Because this column is a picklist</p>
                                                    <lightning-input
                                                        type="checkbox"
                                                        label="Show values as badges"
                                                        field-level-help="Draws each value as an SLDS badge instead of plain text. Drawn inside the cell, so it keeps its shape when a row is hovered."
                                                        data-field={row.field}
                                                        data-attribute="badge"
                                                        checked={row.badge}
                                                        onchange={handleCheckboxChange}
                                                    ></lightning-input>
                                                </div>
                                            </template>

                                            <!-- ---------- Lookup ---------- -->
                                            <template lwc:if={row.isLookupGroup}>
                                                <div class="drawer__section drawer__typed">
                                                    <p class="drawer__typed-why">Because this column is a lookup</p>
                                                    <lightning-input
                                                        type="checkbox"
                                                        label="Show the record name"
                                                        data-field={row.field}
                                                        data-attribute="showName"
                                                        checked={row.showName}
                                                        onchange={handleDefaultOnFlagChange}
                                                    ></lightning-input>
                                                    <lightning-input
                                                        type="checkbox"
                                                        label="Link to the record"
                                                        data-field={row.field}
                                                        data-attribute="link"
                                                        checked={row.link}
                                                        onchange={handleDefaultOnFlagChange}
                                                    ></lightning-input>
                                                </div>
                                            </template>

                                            <!-- ---------- Color ---------- -->
                                            <div class="drawer__section">
                                                <p class="drawer__title">Color</p>
                                                <lightning-combobox
                                                    class="drawer__field"
                                                    label="How this column is colored"
                                                    field-level-help="Per column and Conditional are exclusive. A column-wide color and a per-cell rule fighting over the same cell has no sensible answer."
                                                    data-field={row.field}
                                                    data-role="color-mode"
                                                    value={row.colorMode}
                                                    options={colorModeOptions}
                                                    onchange={handleColorModeChange}
                                                ></lightning-combobox>

                                                <template lwc:if={row.isPerColumnColor}>
                                                    <div class="drawer__row drawer__indent">
                                                        <lightning-combobox
                                                            class="drawer__field"
                                                            label="Style"
                                                            data-field={row.field}
                                                            data-attribute="columnStyle"
                                                            value={row.columnStyle}
                                                            options={row.styleOptions}
                                                            onchange={handleSelectChange}
                                                        ></lightning-combobox>
                                                        <lightning-combobox
                                                            class="drawer__field"
                                                            label="Emphasis"
                                                            data-field={row.field}
                                                            data-attribute="emphasis"
                                                            value={row.columnEmphasis}
                                                            options={emphasisOptions}
                                                            onchange={handleSelectChange}
                                                        ></lightning-combobox>
                                                    </div>
                                                </template>

                                                <template lwc:if={row.isConditionalColor}>
                                                    <div class="drawer__indent">
                                                        <template for:each={row.rules} for:item="rule">
                                                            <div key={rule.key} class="rule">
                                                                <div class="rule__head">
                                                                    <span class="rule__num">{rule.position}</span>
                                                                    <span class="rule__summary">{rule.summary}</span>
                                                                    <lightning-button-icon
                                                                        icon-name="utility:up"
                                                                        variant="bare"
                                                                        alternative-text="Move up"
                                                                        disabled={rule.isFirst}
                                                                        data-field={row.field}
                                                                        data-rule-index={rule.ruleIndex}
                                                                        data-direction="up"
                                                                        onclick={handleMoveRule}
                                                                    ></lightning-button-icon>
                                                                    <lightning-button-icon
                                                                        icon-name="utility:down"
                                                                        variant="bare"
                                                                        alternative-text="Move down"
                                                                        disabled={rule.isLast}
                                                                        data-field={row.field}
                                                                        data-rule-index={rule.ruleIndex}
                                                                        data-direction="down"
                                                                        onclick={handleMoveRule}
                                                                    ></lightning-button-icon>
                                                                    <lightning-button-icon
                                                                        icon-name="utility:delete"
                                                                        variant="bare"
                                                                        alternative-text="Delete rule"
                                                                        data-field={row.field}
                                                                        data-rule-index={rule.ruleIndex}
                                                                        onclick={handleDeleteRule}
                                                                    ></lightning-button-icon>
                                                                </div>

                                                                <div class="rule__body">
                                                                    <div class="drawer__row">
                                                                        <lightning-combobox
                                                                            class="drawer__field"
                                                                            label="Apply when"
                                                                            data-field={row.field}
                                                                            data-rule-index={rule.ruleIndex}
                                                                            data-attribute="logic"
                                                                            value={rule.logic}
                                                                            options={logicOptions}
                                                                            onchange={handleRuleChange}
                                                                        ></lightning-combobox>
                                                                        <template lwc:if={rule.showCustomLogic}>
                                                                            <lightning-input
                                                                                class="drawer__field"
                                                                                type="text"
                                                                                label="Condition logic"
                                                                                placeholder="1 AND (2 OR 3)"
                                                                                field-level-help="Refer to conditions by their number. AND, OR and brackets only."
                                                                                data-field={row.field}
                                                                                data-rule-index={rule.ruleIndex}
                                                                                data-attribute="customLogic"
                                                                                value={rule.customLogic}
                                                                                onchange={handleRuleChange}
                                                                            ></lightning-input>
                                                                        </template>
                                                                    </div>

                                                                    <template lwc:if={rule.showConditions}>
                                                                        <template
                                                                            for:each={rule.conditions}
                                                                            for:item="condition"
                                                                        >
                                                                            <div key={condition.key} class="condition">
                                                                                <span class="condition__num"
                                                                                    >{condition.position}</span
                                                                                >
                                                                                <lightning-combobox
                                                                                    class="condition__field"
                                                                                    variant="label-hidden"
                                                                                    label="Field"
                                                                                    data-field={row.field}
                                                                                    data-rule-index={rule.ruleIndex}
                                                                                    data-condition-index={condition.conditionIndex}
                                                                                    data-attribute="field"
                                                                                    value={condition.field}
                                                                                    options={fieldOptions}
                                                                                    onchange={handleConditionChange}
                                                                                ></lightning-combobox>
                                                                                <lightning-combobox
                                                                                    class="condition__field"
                                                                                    variant="label-hidden"
                                                                                    label="Operator"
                                                                                    data-field={row.field}
                                                                                    data-rule-index={rule.ruleIndex}
                                                                                    data-condition-index={condition.conditionIndex}
                                                                                    data-attribute="operator"
                                                                                    value={condition.operator}
                                                                                    options={condition.operatorOptions}
                                                                                    onchange={handleConditionChange}
                                                                                ></lightning-combobox>
                                                                                <lightning-input
                                                                                    class="condition__field"
                                                                                    variant="label-hidden"
                                                                                    type="text"
                                                                                    label="Value"
                                                                                    data-field={row.field}
                                                                                    data-rule-index={rule.ruleIndex}
                                                                                    data-condition-index={condition.conditionIndex}
                                                                                    data-attribute="value"
                                                                                    value={condition.value}
                                                                                    onchange={handleConditionChange}
                                                                                ></lightning-input>
                                                                                <lightning-button-icon
                                                                                    icon-name="utility:delete"
                                                                                    variant="bare"
                                                                                    alternative-text="Delete condition"
                                                                                    data-field={row.field}
                                                                                    data-rule-index={rule.ruleIndex}
                                                                                    data-condition-index={condition.conditionIndex}
                                                                                    onclick={handleDeleteCondition}
                                                                                ></lightning-button-icon>
                                                                            </div>
                                                                        </template>
                                                                        <lightning-button
                                                                            variant="base"
                                                                            label="Add condition"
                                                                            data-field={row.field}
                                                                            data-rule-index={rule.ruleIndex}
                                                                            onclick={handleAddCondition}
                                                                        ></lightning-button>
                                                                    </template>

                                                                    <div class="drawer__row">
                                                                        <lightning-combobox
                                                                            class="drawer__field"
                                                                            label="Style"
                                                                            data-field={row.field}
                                                                            data-rule-index={rule.ruleIndex}
                                                                            data-attribute="style"
                                                                            value={rule.style}
                                                                            options={rule.styleOptions}
                                                                            onchange={handleRuleChange}
                                                                        ></lightning-combobox>
                                                                        <lightning-combobox
                                                                            class="drawer__field"
                                                                            label="Emphasis"
                                                                            data-field={row.field}
                                                                            data-rule-index={rule.ruleIndex}
                                                                            data-attribute="emphasis"
                                                                            value={rule.emphasis}
                                                                            options={emphasisOptions}
                                                                            onchange={handleRuleChange}
                                                                        ></lightning-combobox>
                                                                        <lightning-input
                                                                            class="drawer__field"
                                                                            type="checkbox"
                                                                            label="Text only"
                                                                            field-level-help="Color the value rather than the whole cell."
                                                                            data-field={row.field}
                                                                            data-rule-index={rule.ruleIndex}
                                                                            data-attribute="textOnly"
                                                                            checked={rule.textOnly}
                                                                            onchange={handleRuleChange}
                                                                        ></lightning-input>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        </template>

                                                        <lightning-button
                                                            variant="neutral"
                                                            label="Add rule"
                                                            data-field={row.field}
                                                            onclick={handleAddRule}
                                                        ></lightning-button>
                                                        <p class="drawer__hint">
                                                            Rules are checked in order and the first match wins. A
                                                            condition can test any column, not only this one.
                                                        </p>
                                                    </div>
                                                </template>
                                            </div>

                                            <!-- ---------- Advanced ---------- -->
                                            <div class="drawer__section">
                                                <p class="drawer__title">Advanced</p>
                                                <div class="drawer__row">
                                                    <c-fgrid_icon-picker
                                                        class="drawer__field"
                                                        label="Cell icon"
                                                        field-level-help="Drawn in every cell of this column, beside the value."
                                                        data-field={row.field}
                                                        data-attribute="icon"
                                                        value={row.icon}
                                                        onchange={handleIconChange}
                                                    ></c-fgrid_icon-picker>
                                                    <c-fgrid_icon-picker
                                                        class="drawer__field"
                                                        label="Header icon"
                                                        field-level-help="Drawn once, in the column header."
                                                        data-field={row.field}
                                                        data-attribute="headerIcon"
                                                        value={row.headerIcon}
                                                        onchange={handleIconChange}
                                                    ></c-fgrid_icon-picker>
                                                </div>
                                                <!-- Only offered with a header icon: hideLabel is documented
                                                     as swapping the text FOR the icon, so on its own the
                                                     label stays and truncates. -->
                                                <template lwc:if={row.hasHeaderIcon}>
                                                    <lightning-input
                                                        type="checkbox"
                                                        label="Show only the icon in the header"
                                                        field-level-help="Replaces the header text with the icon. The label is still read by screen readers."
                                                        data-field={row.field}
                                                        data-attribute="hideLabel"
                                                        checked={row.hideLabel}
                                                        onchange={handleCheckboxChange}
                                                    ></lightning-input>
                                                </template>
                                                <lightning-button
                                                    variant="base"
                                                    label="Reset this column"
                                                    data-field={row.field}
                                                    onclick={handleClearColumn}
                                                ></lightning-button>
                                            </div>
                                        </div>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </template>
                </table>
            </div>
        </template>
    </template>

    <template lwc:else>
        <p class="slds-text-body_small slds-text-color_weak">Select columns first; their attributes appear here.</p>
    </template>
</template>
