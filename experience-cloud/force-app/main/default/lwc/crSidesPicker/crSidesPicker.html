<template>
    <div role="group" aria-label={label}>
        <span class="slds-form-element__label">{label}</span>
        <div class="tiles">
            <template for:each={tiles} for:item="tile">
                <button
                    key={tile.item}
                    type="button"
                    class="tile"
                    aria-pressed={tile.pressed}
                    data-item={tile.item}
                    onclick={handleTileClick}
                >
                    <svg class="tile__icon" viewBox="0 0 20 20" aria-hidden="true">
                        <template lwc:if={isCorners}>
                            <rect class="off" x="3" y="3" width="14" height="14"></rect>
                            <path class="on" d={tile.path}></path>
                        </template>
                        <template lwc:else>
                            <template for:each={tile.edges} for:item="edge">
                                <line
                                    key={edge.edge}
                                    class={edge.className}
                                    x1={edge.x1}
                                    y1={edge.y1}
                                    x2={edge.x2}
                                    y2={edge.y2}
                                ></line>
                            </template>
                        </template>
                    </svg>
                    <span>{tile.label}</span>
                </button>
            </template>
        </div>
    </div>
</template>
