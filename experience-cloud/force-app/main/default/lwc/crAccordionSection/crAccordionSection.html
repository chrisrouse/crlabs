<template>
    <section class={sectionClass} style={sectionStyle}>
        <div class="slds-accordion__summary slds-grid slds-grid_vertical-align-center" style={headerStyle}>
            <h2 class="slds-accordion__summary-heading slds-grow">
                <button
                    class="slds-button slds-button_reset slds-accordion__summary-action slds-grid slds-grid_vertical-align-center"
                    aria-expanded={ariaExpanded}
                    aria-controls={contentId}
                    onclick={handleHeaderClick}
                >
                    <template lwc:if={showToggleIcon}>
                        <lightning-icon
                            icon-name={toggleIconName}
                            size={iconSize}
                            style={iconStyle}
                            class="slds-accordion__summary-action-icon slds-m-right_x-small"
                        ></lightning-icon>
                    </template>
                    <span class="slds-accordion__summary-content">
                        <slot name="title"></slot>
                    </span>
                </button>
            </h2>
            <template lwc:if={showActions}>
                <div class="slds-grid slds-grid_vertical-align-center">
                    <slot name="actions"></slot>
                </div>
            </template>
        </div>
        <div
            id={contentId}
            class="slds-accordion__content"
            style={contentStyle}
            ontransitionend={handleContentTransitionEnd}
        >
            <div class="cr-accordion__clip">
                <div class="cr-accordion__body" style={bodyStyle}>
                    <slot name="content"></slot>
                </div>
            </div>
        </div>
    </section>
</template>
