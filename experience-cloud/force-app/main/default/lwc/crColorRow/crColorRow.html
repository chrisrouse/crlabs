<template>
    <div class="color-row">
        <button class="color-row__trigger" aria-expanded={ariaExpanded} onclick={handleToggle}>
            <span class="color-row__label">{label}</span>
            <span class={dotClass} style={dotStyle}></span>
        </button>
        <template lwc:if={isExpanded}>
            <div class="color-row__detail">
                <div class="color-row__choices" role="group" aria-label={label}>
                    <button
                        class="color-row__choice"
                        data-choice="default"
                        aria-pressed={defaultPressed}
                        onclick={handleUseDefault}
                    >
                        Use Default
                    </button>
                    <button
                        class="color-row__choice"
                        data-choice="custom"
                        aria-pressed={customPressed}
                        onclick={handleUseCustom}
                    >
                        Use Custom
                    </button>
                </div>
                <template lwc:if={isCustom}>
                    <lightning-input
                        type="color"
                        data-field="color"
                        variant="label-hidden"
                        label={customLabel}
                        value={customValue}
                        class="slds-m-top_x-small"
                        onchange={handleColorChange}
                    ></lightning-input>
                    <div class="slds-form-element slds-m-top_x-small">
                        <label class="slds-form-element__label" for="opacity">Opacity</label>
                        <div class="slds-form-element__control">
                            <div class="slds-slider">
                                <input
                                    type="range"
                                    id="opacity"
                                    class="slds-slider__range"
                                    data-field="opacity"
                                    min="0"
                                    max="100"
                                    step="1"
                                    value={opacity}
                                    aria-valuetext={opacityText}
                                    oninput={handleOpacityInput}
                                    onchange={handleOpacityCommit}
                                />
                                <span class="slds-slider__value" aria-hidden="true">{opacityText}</span>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </template>
    </div>
</template>
