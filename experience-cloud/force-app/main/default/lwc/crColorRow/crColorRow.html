<template>
    <div class="color-row">
        <button class="color-row__trigger" aria-expanded={ariaExpanded} onclick={handleToggle}>
            <span class="color-row__label">{label}</span>
            <span class={dotClass} style={dotStyle}></span>
        </button>
        <template lwc:if={isExpanded}>
            <div class="color-row__detail">
                <div class="color-row__choices" role="group" aria-label={label}>
                    <button
                        class="color-row__choice"
                        data-choice="default"
                        aria-pressed={defaultPressed}
                        onclick={handleUseDefault}
                    >
                        Use Default
                    </button>
                    <button
                        class="color-row__choice"
                        data-choice="custom"
                        aria-pressed={customPressed}
                        onclick={handleUseCustom}
                    >
                        Use Custom
                    </button>
                </div>
                <template lwc:if={isCustom}>
                    <c-cr-color-picker
                        class="slds-m-top_x-small"
                        label={label}
                        value={value}
                        oncolorchange={handlePickerChange}
                    ></c-cr-color-picker>
                </template>
            </div>
        </template>
    </div>
</template>
