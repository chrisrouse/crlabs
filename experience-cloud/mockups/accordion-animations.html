<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Accordion animation options</title>
<style>
    :root { --duration: 300ms; --header: #c6d5ff; --open-header: #9fb6ff; --content: #902f8a; }
    body { font-family: -apple-system, "Segoe UI", sans-serif; margin: 2rem; color: #181818; background: #f3f3f3; }
    h1 { font-size: 1.25rem; margin: 0 0 0.25rem; }
    .controls { display: flex; gap: 1.5rem; align-items: center; margin: 1rem 0 2rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 2rem; }
    .demo { background: #fff; padding: 1rem; border-radius: 0.5rem; }
    .demo h2 { font-size: 1rem; margin: 0 0 0.25rem; }
    .demo p.note { font-size: 0.8125rem; color: #5c5c5c; margin: 0 0 1rem; min-height: 2.5em; }

    /* Same structure as crAccordionSection: section padding, header pulled out by negative margins. */
    .section { padding: 0.75rem; border: 4px solid #00d716; border-radius: 12px; overflow: hidden; margin-bottom: 0.25rem; background: #fff; }
    .summary { margin: -0.75rem; padding: 0.75rem; background: var(--header); cursor: pointer; display: flex; gap: 0.5rem; align-items: center;
        transition: margin-bottom var(--duration) ease; }
    .chev { display: inline-block; width: 0.75rem; transition: transform var(--duration) ease; }
    .open > .summary { margin-bottom: 0; background: var(--open-header); }
    .open > .summary .chev { transform: rotate(90deg); }
    .content { display: grid; grid-template-rows: 0fr; margin: 0 -0.75rem; background: var(--content); color: #fff; }
    .open > .content { grid-template-rows: 1fr; margin-bottom: -0.75rem; }
    .clip { min-height: 0; overflow: hidden; }
    .body { padding: 0.875rem; line-height: 1.4; }

    /* 1. Slide (current) */
    .slide .content { transition: grid-template-rows var(--duration) ease, margin-bottom var(--duration) ease; }

    /* 2. Slide + Fade: the height slides and the text fades with it; the background stays solid. */
    .slidefade .content { transition: grid-template-rows var(--duration) ease, margin-bottom var(--duration) ease; }
    .slidefade .body { opacity: 0; transition: opacity var(--duration) ease; }
    .slidefade .open .body { opacity: 1; }

    /* 3. Fade (current): the whole content area fades, background included, so white shows through. */
    .fade .content { opacity: 0; transition: opacity var(--duration) ease, grid-template-rows 0s linear var(--duration), margin-bottom 0s linear var(--duration); }
    .fade .open > .content { opacity: 1; transition: opacity var(--duration) ease; }
    .fade .summary { transition: margin-bottom 0s linear var(--duration); }
    .fade .open > .summary { transition: none; }

    /* 4. Fade Content: background appears at once; only the text fades. */
    .fadecontent .content { transition: grid-template-rows 0s linear var(--duration), margin-bottom 0s linear var(--duration); }
    .fadecontent .open > .content { transition: none; }
    .fadecontent .summary { transition: margin-bottom 0s linear var(--duration); }
    .fadecontent .open > .summary { transition: none; }
    .fadecontent .body { opacity: 0; transition: opacity var(--duration) ease; }
    .fadecontent .open .body { opacity: 1; }

    /* 5. Drawer: the height slides and the content moves down with it, like a pulled-out drawer. */
    .drawer .content { transition: grid-template-rows var(--duration) ease, margin-bottom var(--duration) ease; }
    .drawer .body { transform: translateY(-100%); transition: transform var(--duration) ease; }
    .drawer .open .body { transform: none; }

    /* 6. Zoom: the height slides while the text grows slightly and fades in. */
    .zoom .content { transition: grid-template-rows var(--duration) ease, margin-bottom var(--duration) ease; }
    .zoom .body { opacity: 0; transform: scale(0.96); transform-origin: top center; transition: opacity var(--duration) ease, transform var(--duration) ease; }
    .zoom .open .body { opacity: 1; transform: none; }

    /* 7. Slide, Ease Out: starts fast and settles, which feels quicker at the same duration. */
    .slideout .content, .slideout .summary { transition-timing-function: cubic-bezier(0.2, 0.8, 0.2, 1) !important; }
    .slideout .content { transition: grid-template-rows var(--duration), margin-bottom var(--duration); }

    /* Height only: margins are fixed, so only the row moves. A closed header keeps margin-bottom 0
       and the empty content supplies the -0.75rem instead, which lays out the same. */
    .heightonly .summary, .codepen .summary { margin-bottom: 0; transition: none; }
    .heightonly .content, .codepen .content { margin-bottom: -0.75rem; }

    /* 9. Slide, Height Only */
    .heightonly .content { transition: grid-template-rows var(--duration) ease; }

    /* 10. CodePen: height only, the content travels down with the box, and the header gets a shadow when open. */
    .codepen .content { transition: grid-template-rows var(--duration) ease; }
    .codepen .body { transform: translateY(-100%); visibility: hidden;
        transition: transform var(--duration) ease, visibility 0s var(--duration); }
    .codepen .open .body { transform: none; visibility: visible; transition: transform var(--duration) ease, visibility 0s; }
    .codepen .summary { position: relative; z-index: 1; transition: box-shadow var(--duration) ease; }
    .codepen .open > .summary { box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1); transition: box-shadow calc(var(--duration) / 4) ease; }

    /* 8. Slide + Rotating Chevron: Slide, with one icon that turns instead of swapping icons. */
    .rotate .content { transition: grid-template-rows var(--duration) ease, margin-bottom var(--duration) ease; }
    .static-chev .chev { transition: none; }
    .static-chev .open > .summary .chev { transform: none; }
</style>
</head>
<body>
<h1>Accordion animation options</h1>
<div>Click the headers. Each set closes the others, like the real accordion. Colors match your test page.</div>
<div class="controls">
    <label>Speed
        <select id="speed">
            <option value="500ms">Slow (500ms)</option>
            <option value="400ms">CodePen (400ms)</option>
            <option value="300ms">Normal (300ms)</option>
            <option value="150ms">Fast (150ms)</option>
            <option value="1000ms" selected>Very slow, for inspecting (1s)</option>
        </select>
    </label>
    <label><input type="checkbox" id="autoplay" checked> Autoplay all together</label>
</div>
<div class="grid" id="grid"></div>

<script>
    const demos = [
        ["slide static-chev", "1. Slide (current)", "Height grows from the header. What's deployed now."],
        ["slidefade static-chev", "2. Slide + Fade", "Height slides while the text fades. The background stays solid, so no white flash."],
        ["zoom static-chev", "6. Zoom", "Height slides while the text grows slightly and fades in."],
        ["slideout static-chev", "7. Slide, Ease Out", "Slide that starts fast and settles. Feels quicker at the same speed."],
        ["heightonly static-chev", "9. Slide, Height Only", "Slide with the margins held still, so only the height moves. Compare with 1."],
        ["codepen static-chev", "10. CodePen", "The CodePen's technique: height only, content travels down with the box, a shadow under the open header."]    ];
    const text = "This is the content. This is the content. This is the content. This is the content. This is the content. This is the content.";
    const grid = document.getElementById("grid");
    for (const [cls, title, note] of demos) {
        const demo = document.createElement("div");
        demo.className = `demo ${cls}`;
        demo.innerHTML = `<h2>${title}</h2><p class="note">${note}</p>` + [1, 2, 3].map((n) => `
            <div class="section">
                <div class="summary"><span class="chev">›</span>This is the header ${n}.</div>
                <div class="content"><div class="clip"><div class="body">${text.repeat(n === 2 ? 2 : 1)}</div></div></div>
            </div>`).join("");
        demo.addEventListener("click", (event) => {
            const summary = event.target.closest(".summary");
            if (!summary) return;
            const section = summary.parentElement;
            const opening = !section.classList.contains("open");
            demo.querySelectorAll(".section").forEach((s) => s.classList.remove("open"));
            section.classList.toggle("open", opening);
        });
        grid.appendChild(demo);
    }
    const speed = document.getElementById("speed");
    const applySpeed = () => document.documentElement.style.setProperty("--duration", speed.value);
    speed.addEventListener("change", applySpeed);
    applySpeed();

    // Autoplay: every demo opens the same section at the same moment, cycling 1 → 2 → 3.
    let step = 0;
    let timer;
    const openStep = () => {
        document.querySelectorAll(".demo").forEach((demo) =>
            demo.querySelectorAll(".section").forEach((s, i) => s.classList.toggle("open", i === step % 3)));
        step++;
    };
    const schedule = () => {
        clearTimeout(timer);
        if (!document.getElementById("autoplay").checked) return;
        timer = setTimeout(() => { openStep(); schedule(); }, parseInt(speed.value, 10) + 1200);
    };
    document.getElementById("autoplay").addEventListener("change", schedule);
    speed.addEventListener("change", schedule);
    openStep();
    schedule();
</script>
</body>
</html>
