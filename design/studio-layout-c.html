<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Flow Grid — Grid Studio, layout C developed</title>
        <link
            rel="stylesheet"
            href="https://unpkg.com/@salesforce-ux/design-system@2.24.2/assets/styles/salesforce-lightning-design-system.min.css"
        />
        <style>
            /* LAYOUT MOCKUP. Option C from studio-layout-mockup.html, chosen and
               developed. Clickable, not wired to anything.

               BUILT 2026-09-27, round one, WITHOUT D2 (the "what changed"
               labels in the list), the rule swatches in the list, and D3
               (clicking a preview header). All three dropped by decision; the
               mockup still shows them. D1, D4, D5 and D6 were built.

               Still no new functionality: every control exists in the Studio
               today, with its current label.

               What this pass works out, one state each:
                 1. Columns list    -- what the list shows so columns stay
                                       comparable without a table.
                 2. A column        -- its settings, drilled in.
                 3. Editing a rule  -- the rule editor at inspector width, which
                                       today has the full modal width.
                 4. Table tab       -- the grid-level sections.
                 5. Data tab        -- where a new grid starts.
                 6. Nothing chosen  -- the empty state.
                 7. Errors          -- where validation lands.

               DECISIONS, each marked in the page where it shows:
                 D1  Width 24rem. At 22rem the rule's operator + value pair
                     would not fit side by side.
                 D2  The list shows ONLY what differs from the default, so an
                     unusual column stands out: a changed label, a set width,
                     an alignment, a color. Flag chips stay, always.
                 D3  Clicking a header in the preview opens that column, from
                     any tab. The preview is the map; the inspector is the
                     detail.
                 D4  A rule edits in place, inside its card, one at a time.
                     Conditions stack: field on one line, operator + value on
                     the next.
                 D5  Validation errors sit above the tabs, not inside one, so
                     they are seen whichever tab is open, and each names the
                     tab that fixes it.
                 D6  All Columns, informed by Avonni's All Columns Settings:
                     the four flags Flow Grid has, each showing all / some /
                     none with a count, so a click is predictable. A column
                     that cannot take a flag is skipped and counted. The one
                     piece of NEW functionality in this mockup, by request. */

            body {
                background: #3e3e3c;
                font-size: 13px;
                padding: 1rem;
            }
            .switch {
                display: flex;
                flex-wrap: wrap;
                gap: 0.4rem;
                align-items: center;
                margin-bottom: 0.75rem;
                color: #fff;
            }
            .switch button {
                border: 1px solid #c9c9c9;
                background: #fff;
                color: #181818;
                border-radius: 0.25rem;
                padding: 0.3rem 0.65rem;
                cursor: pointer;
                font-size: 12px;
            }
            .switch button[aria-pressed="true"] {
                border-color: #066afe;
                background: #eef4ff;
                color: #0250d9;
                font-weight: 700;
            }

            .modal {
                background: #fff;
                border-radius: 0.5rem;
                height: calc(100vh - 9rem);
                min-height: 640px;
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }
            .modal__head {
                text-align: center;
                padding: 0.75rem;
                border-bottom: 1px solid #e5e5e5;
            }
            .modal__head h1 {
                font-size: 1.1rem;
            }
            .modal__head p {
                font-size: 11px;
                color: #5c5c5c;
            }
            .modal__body {
                flex: 1;
                display: flex;
                min-height: 0;
            }
            .modal__foot {
                border-top: 1px solid #e5e5e5;
                padding: 0.6rem 1rem;
                text-align: right;
            }

            /* ---------- center: the preview ---------- */
            .center {
                flex: 1;
                min-width: 0;
                background: #f3f3f3;
                padding: 0.75rem;
                overflow: auto;
            }
            .preview {
                background: #fff;
                border: 1px solid #e5e5e5;
                border-radius: 0.25rem;
                padding: 0.6rem;
            }
            .preview__bar {
                display: flex;
                align-items: center;
                gap: 0.5rem;
                margin-bottom: 0.5rem;
            }
            .preview__banner {
                flex: 1;
                font-size: 11px;
                background: #ebf7e6;
                border: 1px solid #91db8b;
                border-radius: 0.25rem;
                padding: 0.2rem 0.5rem;
                color: #2e844a;
            }
            .preview__head {
                display: flex;
                align-items: center;
                gap: 0.5rem;
                margin-bottom: 0.4rem;
            }
            .preview__head .icon {
                width: 1.5rem;
                height: 1.5rem;
                border-radius: 0.25rem;
                background: #5867e8;
            }
            .preview__head small {
                display: block;
                color: #5c5c5c;
                font-size: 11px;
            }
            .preview__search {
                margin-left: auto;
                width: 12rem;
            }
            table.grid {
                width: 100%;
                border-collapse: collapse;
                font-size: 12px;
            }
            table.grid th {
                background: #f3f3f3;
                text-align: left;
                font-weight: 700;
                padding: 0.4rem 0.5rem;
                border-bottom: 1px solid #e5e5e5;
                white-space: nowrap;
                cursor: pointer;
            }
            table.grid th[data-col]:hover {
                background: #e3edfd;
            }
            table.grid td {
                padding: 0.35rem 0.5rem;
                border-bottom: 1px solid #f0f0f0;
                vertical-align: top;
            }
            table.grid .is-selected {
                background: #eef4ff;
                box-shadow:
                    inset 2px 0 0 #066afe,
                    inset -2px 0 0 #066afe;
            }
            table.grid th.is-selected {
                box-shadow:
                    inset 2px 0 0 #066afe,
                    inset -2px 0 0 #066afe,
                    inset 0 2px 0 #066afe;
            }
            .bar {
                height: 0.4rem;
                background: #e5e5e5;
                border-radius: 0.2rem;
                margin-top: 0.15rem;
            }
            .bar > span {
                display: block;
                height: 100%;
                background: #066afe;
                border-radius: 0.2rem;
            }
            .bar.low > span {
                background: #ba0517;
            }
            .hint {
                font-size: 11px;
                color: #5c5c5c;
            }
            .placeholder {
                background: #fff;
                border: 1px dashed #c9c9c9;
                border-radius: 0.25rem;
                padding: 4rem 2rem;
                text-align: center;
                color: #5c5c5c;
            }
            .placeholder strong {
                display: block;
                color: #181818;
                font-size: 14px;
                margin-bottom: 0.25rem;
            }

            /* ---------- right: the inspector ---------- */
            .inspector {
                width: 24rem; /* D1 */
                flex: none;
                border-left: 1px solid #e5e5e5;
                display: flex;
                flex-direction: column;
                min-height: 0;
                background: #fff;
            }
            .inspector__scroll {
                flex: 1;
                overflow: auto;
            }
            .errors {
                background: #fef1ee;
                border-bottom: 1px solid #fe9339;
                padding: 0.5rem 0.75rem;
                font-size: 12px;
            }
            .errors strong {
                color: #ba0517;
            }
            .errors li {
                margin-top: 0.2rem;
            }
            .tabs {
                display: flex;
                border-bottom: 1px solid #e5e5e5;
                flex: none;
                position: relative;
            }
            .tabs > .decision {
                position: absolute;
                top: 0.2rem;
                right: 0.2rem;
            }
            .tabs button {
                flex: 1;
                border: 0;
                background: none;
                padding: 0.6rem 0.25rem;
                font-size: 13px;
                color: #444;
                cursor: pointer;
                border-bottom: 3px solid transparent;
            }
            .tabs button[aria-selected="true"] {
                color: #0250d9;
                font-weight: 700;
                border-bottom-color: #066afe;
            }
            .tabs .badge {
                display: inline-block;
                min-width: 1rem;
                padding: 0 0.3rem;
                border-radius: 1rem;
                background: #ba0517;
                color: #fff;
                font-size: 10px;
                margin-left: 0.25rem;
            }

            .section {
                border-bottom: 1px solid #e5e5e5;
            }
            .section > summary {
                list-style: none;
                cursor: pointer;
                padding: 0.55rem 0.75rem;
                display: flex;
                align-items: center;
                gap: 0.4rem;
            }
            .section > summary::-webkit-details-marker {
                display: none;
            }
            .section > summary::before {
                content: "›";
                width: 0.75rem;
                font-size: 15px;
                color: #5c5c5c;
                transition: transform 0.15s;
            }
            .section[open] > summary::before {
                transform: rotate(90deg);
            }
            .section__body {
                padding: 0 0.75rem 0.75rem 1.9rem;
                display: grid;
                gap: 0.5rem;
            }
            .section__body > *,
            .ctl {
                min-width: 0;
            }
            .ctl label,
            .ctl .lbl {
                display: block;
                font-size: 12px;
                color: #444;
                margin-bottom: 0.15rem;
            }
            .ctl .slds-input,
            .ctl .slds-select {
                height: 1.9rem;
                font-size: 12px;
            }
            .check {
                display: flex;
                gap: 0.4rem;
                align-items: center;
                font-size: 12px;
            }
            .pill-field {
                border: 1px solid #c9c9c9;
                border-radius: 0.25rem;
                padding: 0.3rem 0.5rem;
                font-size: 12px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .pill-field b {
                color: #0250d9;
                font-weight: 400;
            }
            .pill-field .none {
                color: #939393;
            }

            .list-head {
                display: flex;
                align-items: center;
                padding: 0.6rem 0.75rem 0.25rem;
                gap: 0.5rem;
            }
            .list-head .title {
                font-size: 10px;
                text-transform: uppercase;
                letter-spacing: 0.06em;
                color: #5c5c5c;
                font-weight: 700;
                flex: 1;
            }
            .link {
                color: #0250d9;
                cursor: pointer;
                font-size: 12px;
            }
            .colrow {
                display: grid;
                grid-template-columns: 1.2rem 1fr auto;
                gap: 0.4rem;
                align-items: center;
                padding: 0.45rem 0.75rem;
                border-bottom: 1px solid #f0f0f0;
                cursor: pointer;
            }
            .colrow:hover {
                background: #f7f9fb;
            }
            .colrow .num {
                color: #747474;
                font-size: 11px;
                text-align: right;
            }
            .colrow .name {
                min-width: 0;
            }
            .colrow .name strong {
                display: block;
                font-weight: 400;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .colrow .meta {
                font-size: 11px;
                color: #747474;
                display: flex;
                flex-wrap: wrap;
                gap: 0.25rem 0.5rem;
            }
            /* D2: only what differs from the default, so it reads as a signal. */
            .colrow .diff {
                color: #0250d9;
            }
            .colrow .chev {
                color: #939393;
                margin-left: 0.4rem;
            }
            .flags {
                display: flex;
                gap: 2px;
                align-items: center;
            }
            .flag {
                width: 1.1rem;
                height: 1.1rem;
                border-radius: 0.2rem;
                font-size: 9px;
                font-weight: 700;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                background: #f3f3f3;
                color: #c9c9c9;
            }
            .flag.on {
                background: #e3edfd;
                color: #0250d9;
            }
            .swatch {
                width: 1rem;
                height: 1rem;
                border-radius: 0.15rem;
                display: inline-block;
                box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.15);
                flex: none;
                vertical-align: middle;
            }

            .back {
                display: flex;
                align-items: center;
                gap: 0.35rem;
                padding: 0.5rem 0.75rem;
                border-bottom: 1px solid #e5e5e5;
                color: #0250d9;
                cursor: pointer;
                font-size: 12px;
            }
            .back .step {
                margin-left: auto;
                display: flex;
                gap: 0.25rem;
            }
            .back .step button {
                border: 1px solid #c9c9c9;
                background: #fff;
                border-radius: 0.25rem;
                width: 1.6rem;
                height: 1.4rem;
                cursor: pointer;
                color: #444;
            }
            .inspect__head {
                padding: 0.6rem 0.75rem;
                border-bottom: 1px solid #e5e5e5;
            }
            .inspect__head h2 {
                font-size: 14px;
                font-weight: 700;
            }
            .inspect__head code {
                font-size: 11px;
                color: #747474;
                background: none;
            }
            .group {
                padding: 0.6rem 0.75rem;
                border-bottom: 1px solid #f0f0f0;
                display: grid;
                gap: 0.5rem;
            }
            .group__title {
                font-size: 10px;
                text-transform: uppercase;
                letter-spacing: 0.06em;
                color: #5c5c5c;
                font-weight: 700;
            }
            .typed {
                background: #f3f3f3;
                border-radius: 0.25rem;
                padding: 0.5rem;
                display: grid;
                gap: 0.4rem;
            }
            .typed__why {
                font-size: 11px;
                color: #0250d9;
                font-weight: 700;
            }
            .row2 {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 0.5rem;
            }
            .row4 {
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                gap: 0.25rem;
            }

            .rule {
                border: 1px solid #e5e5e5;
                border-radius: 0.25rem;
            }
            .rule.is-open {
                border-color: #066afe;
                box-shadow: 0 0 0 1px #066afe;
            }
            .rule__head {
                display: flex;
                gap: 0.4rem;
                align-items: center;
                padding: 0.4rem 0.5rem;
                font-size: 12px;
            }
            .rule__head .text {
                flex: 1;
                min-width: 0;
            }
            .rule__tools {
                display: flex;
                gap: 0.35rem;
                color: #747474;
            }
            .rule__body {
                border-top: 1px solid #e5e5e5;
                padding: 0.5rem;
                display: grid;
                gap: 0.5rem;
            }
            /* D4: a condition stacks at inspector width. */
            .condition {
                display: grid;
                grid-template-columns: 1.1rem 1fr;
                gap: 0.3rem 0.4rem;
                align-items: center;
                background: #fafaf9;
                border-radius: 0.25rem;
                padding: 0.4rem;
            }
            .condition .n {
                color: #747474;
                font-size: 11px;
                grid-row: span 2;
                align-self: start;
                padding-top: 0.4rem;
            }
            .condition .pair {
                display: grid;
                grid-template-columns: 1fr 1fr 1.2rem;
                gap: 0.3rem;
                align-items: center;
            }
            .condition .slds-select,
            .condition .slds-input {
                height: 1.8rem;
                font-size: 12px;
            }
            .picker {
                display: flex;
                gap: 0.25rem;
                align-items: center;
            }
            .picker .btn {
                border: 1px solid #c9c9c9;
                border-radius: 0.25rem;
                padding: 0.25rem 0.35rem;
                display: flex;
                gap: 0.25rem;
                align-items: center;
                background: #fff;
            }
            .picker .slds-input {
                width: 6rem;
                height: 1.9rem;
                font-size: 12px;
            }

            /* ---------- D6: All Columns ---------- */
            .bulk {
                position: relative;
            }
            .bulk__button {
                height: 1.6rem;
                line-height: 1;
                font-size: 12px;
                padding: 0 0.6rem;
            }
            /* Absolute inside the inspector's own scroller, never fixed: see
               the color picker's floating version for why. */
            .bulk__menu {
                position: absolute;
                right: 0;
                top: calc(100% + 0.25rem);
                width: 19rem;
                background: #fff;
                border: 1px solid #e5e5e5;
                border-radius: 0.25rem;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.16);
                z-index: 5;
                padding: 0.25rem 0;
            }
            .bulk__item {
                display: grid;
                grid-template-columns: 1rem 1.2rem 1fr auto;
                align-items: center;
                gap: 0.4rem;
                padding: 0.45rem 0.75rem;
                color: #181818;
                cursor: pointer;
                text-decoration: none;
            }
            .bulk__item:hover {
                background: #f3f3f3;
                text-decoration: none;
                color: #181818;
            }
            .bulk__item input {
                pointer-events: none;
            }
            .bulk__icon {
                color: #5c5c5c;
                text-align: center;
            }
            .bulk__text small {
                display: block;
                font-size: 11px;
                color: #747474;
            }
            .bulk__action {
                font-size: 11px;
                color: #0250d9;
                visibility: hidden;
            }
            .bulk__item:hover .bulk__action {
                visibility: visible;
            }
            .bulk__foot {
                border-top: 1px solid #f0f0f0;
                margin-top: 0.25rem;
                padding: 0.4rem 0.75rem 0.2rem;
                font-size: 11px;
                color: #5c5c5c;
            }

            .decision {
                display: inline-block;
                font-size: 9px;
                font-weight: 700;
                color: #fff;
                background: #9050e9;
                border-radius: 0.2rem;
                padding: 0 0.25rem;
                margin-left: 0.3rem;
                vertical-align: middle;
            }
            .note {
                margin-top: 0.6rem;
                color: #d8d8d8;
                font-size: 12px;
                line-height: 1.5;
            }
            .note b {
                color: #fff;
            }
        </style>
    </head>
    <body>
        <div class="switch" id="switch"></div>

        <div class="modal">
            <div class="modal__head">
                <h1>Grid Studio</h1>
                <p>Changes apply immediately and are saved with the Flow element.</p>
            </div>
            <div class="modal__body" id="body"></div>
            <div class="modal__foot"><button class="slds-button slds-button_brand">Done</button></div>
        </div>

        <div class="note" id="note"></div>

        <script>
            /* ------------------------------------------------------------------ *
             * Data, from the current Studio screenshots.
             * `diff` is what an admin changed from the default (D2).
             * ------------------------------------------------------------------ */
            const COLUMNS = [
                { field: "Name", label: "Account Name", type: "Text", flags: [0, 0, 1, 1] },
                { field: "Industry", label: "Industry", type: "Picklist", flags: [1, 0, 1, 1] },
                {
                    field: "Description",
                    label: "Account Description",
                    type: "Long Text",
                    flags: [0, 0, 1, 1],
                    diff: ["Width 24rem"]
                },
                {
                    field: "Type",
                    label: "Account Type",
                    type: "Picklist",
                    flags: [1, 0, 1, 1],
                    diff: ["Label changed"]
                },
                { field: "SLA__c", label: "SLA", type: "Picklist", flags: [1, 0, 1, 1], diff: ["Header icon"] },
                {
                    field: "Percent_Test__c",
                    label: "Percent Test",
                    type: "Progress Bar",
                    flags: [0, 0, 1, 1],
                    // A gauge has no edit template, so Edit can never apply.
                    noEdit: true,
                    diff: ["Align right"],
                    rules: [
                        { text: "Percent Test less than 30", color: "#ba0517" },
                        { text: "Percent Test equals 100", color: "#2e844a" }
                    ]
                }
            ];
            const ROWS = [
                [
                    "Edge Communications",
                    "Electronics",
                    "Edge, founded in 1998, is a start-up based in Austin, TX.",
                    "Customer - Direct",
                    "Silver",
                    82
                ],
                ["Burlington Textiles Corp of America", "Apparel", "", "Customer - Direct", "Silver", 45],
                ["Pyramid Construction Inc.", "Construction", "", "Customer - Channel", "Silver", 18],
                ["Dickenson plc", "Consulting", "", "Customer - Channel", "Bronze", 60],
                [
                    "Grand Hotels & Resorts Ltd",
                    "Hospitality",
                    "Chain of hotels and resorts across the US, UK, Eastern Europe.",
                    "Customer - Direct",
                    "Gold",
                    100
                ],
                [
                    "United Oil & Gas Corp.",
                    "Energy",
                    "World's third largest oil and gas company.",
                    "Customer - Direct",
                    "Platinum",
                    25
                ]
            ];

            const DATA_SECTIONS = (chosen) => [
                {
                    label: "Data Source",
                    open: true,
                    controls: [
                        ["check", "Use a User-Defined Object Instead of Salesforce Records"],
                        ["pill", "Records", chosen ? "{!Get_Accounts}" : ""],
                        ["pill", "Pre-Selected Records", ""],
                        ["pill", "Disabled Records", ""]
                    ]
                },
                {
                    label: "Configure Rows",
                    controls: [
                        ["select", "Row Selection Mode", "Multiple"],
                        ["pair", "Minimum Selection", "", "Maximum Selection", ""],
                        ["check", "Require User to Make a Selection"],
                        ["select", "Unique Identifier", "Id"]
                    ]
                }
            ];
            const TABLE_SECTIONS = [
                {
                    label: "Table Display",
                    open: true,
                    controls: [
                        ["check", "Show a Header Above the Grid", true],
                        ["text", "Header Label", "Accounts"],
                        ["text", "Header Icon", "standard:account"],
                        ["check", "Show the Record Count in the Header", true],
                        ["check", "Show the Selected Count in the Header", true],
                        ["check", "Show Row Numbers", true],
                        ["check", "Limit Wrapped Text to Three Lines"],
                        ["check", "Show a Lock on Read-Only Columns", true],
                        ["pair", "Grid Height", "30", "Unit", "rem"]
                    ]
                },
                {
                    label: "Search, Filter & Sort",
                    controls: [
                        ["check", "Show a Search Bar", true],
                        ["check", "Limit Search to a Single Column"],
                        ["check", "Hide Column Header Actions"],
                        ["check", "Match Case on Column Filters", true]
                    ]
                },
                {
                    label: "Pagination",
                    controls: [
                        ["select", "Row Loading", "Paginate"],
                        ["text", "Records per Page", "10"],
                        ["check", "Let Users Change the Page Size"],
                        ["text", "Maximum Records to Display", ""]
                    ]
                },
                {
                    label: "Inline Editing",
                    controls: [
                        ["check", "Hide the Cancel/Save Buttons"],
                        ["check", "Go to the Next Flow Element on Save"]
                    ]
                },
                {
                    label: "Row Action",
                    controls: [
                        ["select", "Row Action", "Remove Row"],
                        ["select", "Display as", "Icon"],
                        ["select", "Action Column Position", "Left"],
                        ["text", "Hover Text", "Remove"],
                        ["text", "Maximum Rows That Can Be Removed", ""]
                    ]
                },
                {
                    label: "Links & Formatting",
                    controls: [
                        ["check", "Do Not Link the Name Field"],
                        ["check", "Open Links in the Same Tab"],
                        ["check", "Do Not Convert Currency Values"]
                    ]
                },
                { label: "Picklist Editing", controls: [["select", "Filter Picklists by Record Type", "Off"]] }
            ];

            /* ------------------------------------------------------------------ *
             * States
             * ------------------------------------------------------------------ */
            const STATES = [
                {
                    key: "list",
                    label: "1 · Columns list",
                    note: "<b>The Columns tab.</b> Flag chips always show; beyond them, a row shows only what was changed from the default (D2) — so Description's width, Type's renamed label and Percent Test's rules stand out, and an untouched column is one clean line. Click a row, or a header in the preview (D3), to open it.",
                    tab: "columns"
                },
                {
                    key: "column",
                    label: "2 · A column",
                    note: "<b>One column, drilled in.</b> Label, width, align and the four flags lead, then the type and what it implies, then color, then advanced. Back returns to the list; the arrows step to the previous or next column without going back, which covers most of what the old table view was good for.",
                    tab: "columns",
                    drilled: true
                },
                {
                    key: "rule",
                    label: "3 · Editing a rule",
                    note: "<b>A rule at inspector width.</b> One rule opens in its card at a time (D4). Each condition stacks: field on its own line, operator and value side by side below it. The color picker is the inline one already built, closed here. This is the tightest spot in C, and it fits at 24rem (D1).",
                    tab: "columns",
                    drilled: true,
                    ruleOpen: true
                },
                {
                    key: "table",
                    label: "4 · Table tab",
                    note: "<b>The Table tab.</b> Everything about the grid as a whole, in today's sections and order, less the two that moved to Data.",
                    tab: "table"
                },
                {
                    key: "data",
                    label: "5 · Data tab",
                    note: "<b>The Data tab.</b> Where the records come from and how rows behave: Data Source and Configure Rows. Configure Columns is not here; choosing columns is the top of the Columns tab, next to the list it changes.",
                    tab: "data"
                },
                {
                    key: "empty",
                    label: "6 · Nothing chosen",
                    note: "<b>A new grid.</b> With no record collection there is nothing to preview and no columns to list, so the Studio opens on Data and the preview says what unlocks it. The other tabs stay usable: table settings do not need data.",
                    tab: "data",
                    empty: true
                },
                {
                    key: "errors",
                    label: "7 · Errors",
                    note: "<b>Validation.</b> Errors sit above the tabs (D5), so they show whichever tab is open, and each names where it is fixed; the tab carries a count. Today they sit at the top of the left pane only.",
                    tab: "table",
                    errors: true
                },
                {
                    key: "bulk",
                    label: "8 · All columns menu",
                    note: "<b>All Columns.</b> One menu instead of a checkbox per column (D6). Each item shows where it stands — all, some or none, with a count — so a click is predictable: it turns the flag on for every column unless every column already has it, then off. It stays open so several can be set in a row. A column that cannot take a flag is skipped and said so: Percent Test is a gauge and can never be edited. Only the four flags Flow Grid has are here; Avonni's Display as Input, Searchable and Hide Default Actions have no per-column equivalent yet.",
                    tab: "columns",
                    menuOpen: true
                }
            ];

            let state = STATES.find((s) => s.key === (location.hash || "#list").slice(1)) || STATES[0];
            let tab = state.tab;
            let drilled = Boolean(state.drilled);
            let selected = 5;
            let ruleOpen = Boolean(state.ruleOpen);
            let menuOpen = Boolean(state.menuOpen);

            /* ------------------------------------------------------------------ *
             * Pieces
             * ------------------------------------------------------------------ */
            const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
            const decision = (d) => `<span class="decision" title="Decision ${d}, see the file header">${d}</span>`;

            function control([kind, label, a, b, bv]) {
                if (kind === "check") {
                    return `<label class="check"><input type="checkbox" ${a ? "checked" : ""}/> ${esc(label)}</label>`;
                }
                if (kind === "pill") {
                    return `<div class="ctl"><span class="lbl">${esc(label)}</span><div class="pill-field">${a ? `<b>${esc(a)}</b>` : `<span class="none">Choose a resource…</span>`}</div></div>`;
                }
                if (kind === "select") {
                    return `<div class="ctl"><label>${esc(label)}</label><select class="slds-select"><option>${esc(a)}</option></select></div>`;
                }
                if (kind === "pair") {
                    return `<div class="row2"><div class="ctl"><label>${esc(label)}</label><input class="slds-input" value="${esc(a)}"/></div><div class="ctl"><label>${esc(b)}</label><input class="slds-input" value="${esc(bv)}"/></div></div>`;
                }
                return `<div class="ctl"><label>${esc(label)}</label><input class="slds-input" value="${esc(a)}"/></div>`;
            }
            const section = (s) =>
                `<details class="section" ${s.open ? "open" : ""}><summary>${esc(s.label)}</summary><div class="section__body">${s.controls.map(control).join("")}</div></details>`;

            function flagChips(c) {
                return `<span class="flags">${["E", "F", "S", "W"]
                    .map(
                        (t, i) =>
                            `<span class="flag ${c.flags[i] ? "on" : ""}" title="${["Edit", "Filter", "Sort", "Wrap"][i]}">${t}</span>`
                    )
                    .join("")}</span>`;
            }

            function preview() {
                if (state.empty) {
                    return `<div class="placeholder"><strong>Choose a record collection to see a preview</strong>Data › Data Source › Records. Columns come from that object.</div>`;
                }
                const sel = drilled && tab === "columns" ? selected : -1;
                const head = COLUMNS.map(
                    (c, i) =>
                        `<th data-col="${i}" class="${i === sel ? "is-selected" : ""}" title="Edit this column">${c.field === "SLA__c" ? "⛓ " : ""}${esc(c.label)} ▾</th>`
                ).join("");
                const body = ROWS.map(
                    (r, ri) =>
                        `<tr><td style="color:#747474">${ri + 1}</td><td style="color:#ba0517">🗑</td>${r
                            .map((v, ci) => {
                                const cls = ci === sel ? "is-selected" : "";
                                if (ci === 5) {
                                    const fill = v < 30 ? "low" : "";
                                    const green = v === 100 ? ' style="background:#2e844a"' : "";
                                    return `<td class="${cls}" style="min-width:8rem"><div style="text-align:right;font-weight:700;font-size:11px">${v}%</div><div class="bar ${fill}"><span style="width:${v}%${v === 100 ? ";background:#2e844a" : ""}"></span></div></td>`;
                                }
                                return `<td class="${cls}">${esc(v)}</td>`;
                            })
                            .join("")}</tr>`
                ).join("");
                return `<div class="preview">
                    <div class="preview__bar">
                        <div class="preview__banner">✓ Live preview using real records from this object.</div>
                        <div class="ctl" style="width:9rem"><select class="slds-select"><option>Preview size: Large</option></select></div>
                    </div>
                    <div class="preview__head"><span class="icon"></span><div><strong>Accounts</strong><small>6 items · 0 selected</small></div>
                        <input class="slds-input preview__search" placeholder="Search…" /></div>
                    <table class="grid"><thead><tr><th></th><th></th>${head}</tr></thead><tbody>${body}</tbody></table>
                    <p class="hint slds-m-top_x-small">Remove row action, shown as an icon on the left. Click a column header to edit that column.${decision("D3")}</p>
                </div>`;
            }

            /* D6: All Columns. The four comparable flags, each with its state
               across the columns that can take it. */
            const BULK = [
                { index: 0, label: "Editable", icon: "✎", skip: (c) => c.noEdit, why: "can't be edited" },
                { index: 1, label: "Filterable", icon: "⏷" },
                { index: 2, label: "Sortable", icon: "⇅" },
                { index: 3, label: "Wrap Text", icon: "↵" }
            ];

            function bulkState(item) {
                const eligible = COLUMNS.filter((c) => !item.skip?.(c));
                const on = eligible.filter((c) => c.flags[item.index]).length;
                return {
                    eligible: eligible.length,
                    on,
                    skipped: COLUMNS.length - eligible.length,
                    all: on === eligible.length,
                    none: on === 0
                };
            }

            function allColumnsMenu() {
                const items = BULK.map((item) => {
                    const st = bulkState(item);
                    const mark = st.all ? "all" : st.none ? "none" : "some";
                    const action = st.all ? "Turn off for all" : "Turn on for all";
                    return `<li role="presentation">
                        <a class="bulk__item" role="menuitemcheckbox" aria-checked="${st.all ? "true" : st.none ? "false" : "mixed"}" data-bulk="${item.index}" title="${action}">
                            <input type="checkbox" tabindex="-1" data-mark="${mark}" ${st.all ? "checked" : ""}/>
                            <span class="bulk__icon" aria-hidden="true">${item.icon}</span>
                            <span class="bulk__text">${item.label}
                                <small>${st.on} of ${st.eligible} columns${st.skipped ? ` · ${st.skipped} ${item.why}` : ""}</small></span>
                            <span class="bulk__action">${action}</span>
                        </a></li>`;
                }).join("");
                const menu = menuOpen
                    ? `<div class="bulk__menu" role="menu"><ul>${items}</ul>
                        <p class="bulk__foot">Applies to every column now. Change one afterwards in its own settings.</p></div>`
                    : "";
                return `<span class="bulk"><button type="button" class="slds-button slds-button_neutral bulk__button" aria-haspopup="menu" aria-expanded="${menuOpen}" data-menu>All Columns ▾</button>${menu}</span>`;
            }

            function columnsList() {
                const rows = COLUMNS.map((c, i) => {
                    const diffs = [...(c.diff || []), ...(c.rules ? [`${c.rules.length} rules`] : [])];
                    const swatches = (c.rules || [])
                        .map((r) => `<span class="swatch" style="background:${r.color}"></span>`)
                        .join("");
                    return `<div class="colrow" data-col="${i}">
                        <span class="num">${i + 1}</span>
                        <span class="name"><strong>${esc(c.label)}</strong>
                            <span class="meta"><span>${esc(c.field)} · ${esc(c.type)}</span>${diffs.map((d) => `<span class="diff">${esc(d)}</span>`).join("")}${swatches}</span></span>
                        <span class="flags">${flagChips(c)}<span class="chev">›</span></span>
                    </div>`;
                }).join("");
                return `<div class="section__body" style="padding:0.6rem 0.75rem 0.25rem">${control(["pill", "Columns", "6 fields · Account Name, Industry, Description…"])}</div>
                    <div class="list-head"><span class="title">6 columns · click one to edit${decision("D2")}</span>${allColumnsMenu()}${menuOpen ? decision("D6") : ""}</div>
                    ${rows}
                    <div style="padding:0.6rem 0.75rem"><span class="link">Reset all attributes</span></div>`;
            }

            function colorPicker(hex) {
                return `<div class="picker"><span class="btn"><span class="swatch" style="background:${hex}"></span>▾</span><input class="slds-input" value="${hex}"/></div>`;
            }

            function rules(c) {
                return c.rules
                    .map((r, i) => {
                        const open = ruleOpen && i === 0;
                        const body = open
                            ? `<div class="rule__body">
                                ${control(["select", "Apply when", "All Conditions Are Met"])}
                                <div class="condition">
                                    <span class="n">1</span>
                                    <select class="slds-select"><option>Percent Test</option></select>
                                    <span class="pair"><select class="slds-select"><option>less than</option></select><input class="slds-input" value="30"/><span style="color:#747474;text-align:center">🗑</span></span>
                                </div>
                                <span class="link">+ Add condition</span>
                                <div class="ctl"><span class="lbl">Color</span>${colorPicker(r.color)}</div>
                                <span class="hint">A gauge's color is its fill, so there is no Text only here.</span>
                            </div>`
                            : "";
                        return `<div class="rule ${open ? "is-open" : ""}" data-rule="${i}">
                            <div class="rule__head"><span class="hint">${i + 1}</span><span class="swatch" style="background:${r.color}"></span>
                                <span class="text">${esc(r.text)} → ${r.color}</span>
                                <span class="rule__tools">↑ ↓ 🗑 <span class="link">${open ? "Done" : "Edit"}</span></span></div>
                            ${body}
                        </div>`;
                    })
                    .join("");
            }

            function columnDetail() {
                const c = COLUMNS[selected];
                const flagsRow = ["Edit", "Filter", "Sort", "Wrap"]
                    .map(
                        (n, i) =>
                            `<label class="check"><input type="checkbox" ${c.flags[i] ? "checked" : ""}/> ${n}</label>`
                    )
                    .join("");
                const gauge = c.type === "Progress Bar";
                const typed = gauge
                    ? `<div class="typed"><span class="typed__why">Because this column is a gauge</span>
                        <div class="row2">${control(["select", "Thickness", "Medium"])}${control(["select", "Ends", "Square"])}</div>
                        <label class="check"><input type="checkbox" checked/> Show the value</label>
                        <span class="hint">A gauge cannot be edited, so this column is read-only whatever the Edit box says.</span></div>`
                    : `<div class="typed"><span class="typed__why">Because this column is ${c.type === "Picklist" ? "a picklist" : "text"}</span><label class="check"><input type="checkbox"/> ${c.type === "Picklist" ? "Show values as badges" : "Turn URLs into links"}</label></div>`;
                const color = c.rules
                    ? `${control(["select", "How this column is colored", "Conditional — a color per cell, by rule"])}<div style="display:grid;gap:0.4rem">${rules(c)}</div><span class="link">+ Add rule</span>
                        <span class="hint">Rules are checked in order and the first match wins. A condition can test any column, not only this one.</span>`
                    : control(["select", "How this column is colored", "None"]);
                return `<div class="back"><span data-back>‹ All columns</span>
                        <span class="step"><button data-step="-1" title="Previous column">‹</button><button data-step="1" title="Next column">›</button></span></div>
                    <div class="inspect__head"><h2>${selected + 1}. ${esc(c.label)}</h2><code>${esc(c.field)}</code></div>
                    <div class="group"><div class="group__title">Column</div>
                        ${control(["text", "Label", c.label])}
                        <div class="row2">${control(["text", "Width", c.field === "Description" ? "24" : "Auto"])}${control(["select", "Align", c.field === "Percent_Test__c" ? "Right" : "Default"])}</div>
                        <div class="row4">${flagsRow}</div></div>
                    <div class="group"><div class="group__title">Display</div>${control(["select", "Type", c.type])}${typed}</div>
                    <div class="group"><div class="group__title">Color${ruleOpen ? decision("D4") : ""}</div>${color}</div>
                    <div class="group"><div class="group__title">Advanced</div>
                        ${control(["text", "Cell icon", ""])}${control(["text", "Header icon", c.field === "SLA__c" ? "utility:hierarchy" : ""])}
                        <span class="link">Reset this column</span></div>`;
            }

            function inspector() {
                let content;
                if (tab === "data") {
                    content = DATA_SECTIONS(!state.empty).map(section).join("");
                } else if (tab === "table") {
                    content = TABLE_SECTIONS.map(section).join("");
                } else if (state.empty) {
                    content = `<div class="section__body" style="padding:0.75rem">${control(["pill", "Columns", ""])}<p class="hint">Choose a record collection on the Data tab first — columns come from that object.</p></div>`;
                } else {
                    content = drilled ? columnDetail() : columnsList();
                }
                const errors = state.errors
                    ? `<div class="errors" role="alert"><strong>Fix the following:${decision("D5")}</strong><ul>
                        <li>Records per Page must be between 1 and 200. <span class="link">Table › Pagination</span></li>
                        <li>Maximum Selection is less than Minimum Selection. <span class="link">Data › Configure Rows</span></li></ul></div>`
                    : "";
                const count = (k) =>
                    state.errors && (k === "table" || k === "data") ? '<span class="badge">1</span>' : "";
                return `<div class="inspector">${errors}
                    <div class="tabs" role="tablist">${[
                        ["data", "Data"],
                        ["table", "Table"],
                        ["columns", "Columns"]
                    ]
                        .map(
                            ([k, n]) =>
                                `<button role="tab" data-tab="${k}" aria-selected="${tab === k}">${n}${count(k)}</button>`
                        )
                        .join("")}${decision("D1")}</div>
                    <div class="inspector__scroll">${content}</div></div>`;
            }

            function render() {
                document.getElementById("switch").innerHTML =
                    "<strong>State:</strong>" +
                    STATES.map(
                        (s) =>
                            `<button type="button" data-state="${s.key}" aria-pressed="${s === state}">${s.label}</button>`
                    ).join("");
                document.getElementById("body").innerHTML = `<div class="center">${preview()}</div>${inspector()}`;
                document.getElementById("note").innerHTML = state.note;
                // Bring an open rule into view: it sits below the column's other groups.
                document.querySelector(".rule.is-open")?.scrollIntoView({ block: "start" });
                document.querySelectorAll('[data-mark="some"]').forEach((box) => (box.indeterminate = true));
            }

            document.addEventListener("click", (event) => {
                const s = event.target.closest("[data-state]");
                if (s) {
                    state = STATES.find((x) => x.key === s.dataset.state);
                    tab = state.tab;
                    drilled = Boolean(state.drilled);
                    ruleOpen = Boolean(state.ruleOpen);
                    menuOpen = Boolean(state.menuOpen);
                    selected = 5;
                    history.replaceState(null, "", `#${state.key}`);
                    return render();
                }
                if (event.target.closest("[data-menu]")) {
                    menuOpen = !menuOpen;
                    return render();
                }
                const bulk = event.target.closest("[data-bulk]");
                if (bulk) {
                    const item = BULK.find((b) => b.index === Number(bulk.dataset.bulk));
                    const value = bulkState(item).all ? 0 : 1;
                    COLUMNS.forEach((c) => {
                        if (!item.skip?.(c)) {
                            c.flags[item.index] = value;
                        }
                    });
                    return render(); // stays open, so several can be set in a row
                }
                if (menuOpen && !event.target.closest(".bulk__menu")) {
                    menuOpen = false;
                    render();
                }
                const col = event.target.closest("[data-col]");
                if (col) {
                    selected = Number(col.dataset.col);
                    tab = "columns";
                    drilled = true;
                    ruleOpen = false;
                    return render();
                }
                const t = event.target.closest("[data-tab]");
                if (t) {
                    tab = t.dataset.tab;
                    if (tab === "columns") {
                        drilled = false;
                    }
                    return render();
                }
                if (event.target.closest("[data-back]")) {
                    drilled = false;
                    return render();
                }
                const step = event.target.closest("[data-step]");
                if (step) {
                    selected = (selected + Number(step.dataset.step) + COLUMNS.length) % COLUMNS.length;
                    ruleOpen = false;
                    return render();
                }
                const rule = event.target.closest("[data-rule]");
                if (rule && event.target.closest(".link")) {
                    ruleOpen = !ruleOpen;
                    return render();
                }
            });

            render();
        </script>
    </body>
</html>
