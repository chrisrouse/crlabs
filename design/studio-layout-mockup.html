<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Flow Grid — Grid Studio layout options</title>
        <link
            rel="stylesheet"
            href="https://unpkg.com/@salesforce-ux/design-system@2.24.2/assets/styles/salesforce-lightning-design-system.min.css"
        />
        <style>
            /* LAYOUT MOCKUP. Clickable, not wired to anything.

               Scope: the SAME controls the Studio has today, rearranged. No
               new functionality -- no bulk column menu, no field palette, no
               drag reordering, no templates. Section and control labels are
               taken from fgrid_propertySchema.js.

               Every option keeps the rule from column-attributes-c.html:
               compare it across columns -> it lives in the column row; only
               meaningful for one column -> it lives in that column's detail.

               A  Three panes. Data on the left, preview in the middle, one
                  inspector on the right with Table and Column tabs.
               B  Preview with a column dock. Table settings stay on the left;
                  the column table moves into a docked master/detail under the
                  preview, so its detail no longer spans the whole width.
               C  Preview first. One inspector on the right holds Data, Table
                  and Columns; a column drills in and Back returns. */

            body {
                background: #3e3e3c;
                font-size: 13px;
                padding: 1rem;
            }
            .switch {
                display: flex;
                gap: 0.5rem;
                align-items: center;
                margin-bottom: 0.75rem;
                color: #fff;
            }
            .switch button {
                border: 1px solid #c9c9c9;
                background: #fff;
                border-radius: 0.25rem;
                padding: 0.3rem 0.75rem;
                cursor: pointer;
                font-size: 12px;
                color: #181818;
            }
            .switch button[aria-pressed="true"] {
                border-color: #066afe;
                background: #eef4ff;
                color: #0250d9;
                font-weight: 700;
            }
            .switch .why {
                color: #d8d8d8;
                font-size: 12px;
                margin-left: 0.5rem;
            }

            /* ---------- the modal frame, as the Studio renders today ---------- */
            .modal {
                background: #fff;
                border-radius: 0.5rem;
                height: calc(100vh - 8.5rem);
                min-height: 640px;
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }
            .modal__head {
                text-align: center;
                padding: 0.75rem;
                border-bottom: 1px solid #e5e5e5;
            }
            .modal__head h1 {
                font-size: 1.1rem;
            }
            .modal__head p {
                font-size: 11px;
                color: #5c5c5c;
            }
            .modal__body {
                flex: 1;
                display: flex;
                min-height: 0;
                background: #f3f3f3;
            }
            .modal__foot {
                border-top: 1px solid #e5e5e5;
                padding: 0.6rem 1rem;
                text-align: right;
            }

            /* ---------- panes ---------- */
            .pane {
                background: #fff;
                overflow: auto;
                min-height: 0;
            }
            .pane_left {
                width: 18rem;
                flex: none;
                border-right: 1px solid #e5e5e5;
            }
            .pane_right {
                width: 22rem;
                flex: none;
                border-left: 1px solid #e5e5e5;
            }
            .pane_center {
                flex: 1;
                min-width: 0;
                background: #f3f3f3;
                display: flex;
                flex-direction: column;
                padding: 0.75rem;
                gap: 0.75rem;
                overflow: auto;
            }
            .pane__title {
                font-size: 10px;
                text-transform: uppercase;
                letter-spacing: 0.06em;
                color: #5c5c5c;
                padding: 0.6rem 0.75rem 0.25rem;
                font-weight: 700;
            }

            /* ---------- accordion sections ---------- */
            .section {
                border-bottom: 1px solid #e5e5e5;
            }
            .section > summary {
                list-style: none;
                cursor: pointer;
                padding: 0.55rem 0.75rem;
                font-size: 13px;
                color: #181818;
                display: flex;
                align-items: center;
                gap: 0.4rem;
            }
            .section > summary::-webkit-details-marker {
                display: none;
            }
            .section > summary::before {
                content: "›";
                display: inline-block;
                width: 0.75rem;
                font-size: 15px;
                color: #5c5c5c;
                transition: transform 0.15s;
            }
            .section[open] > summary::before {
                transform: rotate(90deg);
            }
            .section__body {
                padding: 0 0.75rem 0.75rem 1.9rem;
                display: grid;
                gap: 0.5rem;
            }
            .ctl,
            .section__body > * {
                min-width: 0;
            }
            .ctl label,
            .ctl .lbl {
                display: block;
                font-size: 12px;
                color: #444;
                margin-bottom: 0.15rem;
            }
            .ctl .slds-input,
            .ctl .slds-select {
                height: 1.9rem;
                font-size: 12px;
            }
            .check {
                display: flex;
                gap: 0.4rem;
                align-items: center;
                font-size: 12px;
            }
            .pill-field {
                border: 1px solid #c9c9c9;
                border-radius: 0.25rem;
                padding: 0.3rem 0.5rem;
                font-size: 12px;
                display: flex;
                gap: 0.4rem;
                align-items: center;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .pill-field b {
                color: #0250d9;
                font-weight: 400;
            }

            /* ---------- preview ---------- */
            .preview {
                background: #fff;
                border: 1px solid #e5e5e5;
                border-radius: 0.25rem;
                padding: 0.6rem;
                /* Never squeezed by a dock below it: the center pane scrolls. */
                flex: none;
            }
            .preview__bar {
                display: flex;
                align-items: center;
                gap: 0.5rem;
                margin-bottom: 0.5rem;
            }
            .preview__banner {
                flex: 1;
                font-size: 11px;
                background: #ebf7e6;
                border: 1px solid #91db8b;
                border-radius: 0.25rem;
                padding: 0.2rem 0.5rem;
                color: #2e844a;
            }
            .preview__head {
                display: flex;
                align-items: center;
                gap: 0.5rem;
                margin-bottom: 0.4rem;
            }
            .preview__head .icon {
                width: 1.5rem;
                height: 1.5rem;
                border-radius: 0.25rem;
                background: #5867e8;
            }
            .preview__head small {
                display: block;
                color: #5c5c5c;
                font-size: 11px;
            }
            .preview__search {
                margin-left: auto;
                width: 12rem;
            }
            table.grid {
                width: 100%;
                border-collapse: collapse;
                font-size: 12px;
            }
            table.grid th {
                background: #f3f3f3;
                text-align: left;
                font-weight: 700;
                padding: 0.4rem 0.5rem;
                border-bottom: 1px solid #e5e5e5;
                white-space: nowrap;
                cursor: pointer;
                position: relative;
            }
            table.grid th:hover {
                background: #eaeaea;
            }
            table.grid td {
                padding: 0.35rem 0.5rem;
                border-bottom: 1px solid #f0f0f0;
                vertical-align: top;
            }
            table.grid th.is-selected,
            table.grid td.is-selected {
                box-shadow:
                    inset 2px 0 0 #066afe,
                    inset -2px 0 0 #066afe;
                background: #eef4ff;
            }
            table.grid th.is-selected {
                box-shadow:
                    inset 2px 0 0 #066afe,
                    inset -2px 0 0 #066afe,
                    inset 0 2px 0 #066afe;
            }
            .bar {
                height: 0.4rem;
                background: #e5e5e5;
                border-radius: 0.2rem;
                margin-top: 0.15rem;
            }
            .bar > span {
                display: block;
                height: 100%;
                background: #066afe;
                border-radius: 0.2rem;
            }
            .bar.low > span {
                background: #ba0517;
            }
            .hint {
                font-size: 11px;
                color: #5c5c5c;
            }

            /* ---------- compact column list (A, B, C) ---------- */
            .collist {
                display: grid;
            }
            .colrow {
                display: grid;
                grid-template-columns: 1.3rem 1fr auto;
                align-items: center;
                gap: 0.4rem;
                padding: 0.4rem 0.75rem;
                border-bottom: 1px solid #f0f0f0;
                cursor: pointer;
            }
            .colrow:hover {
                background: #f7f9fb;
            }
            .colrow.is-selected {
                background: #eef4ff;
                box-shadow: inset 3px 0 0 #066afe;
            }
            .colrow .num {
                color: #747474;
                font-size: 11px;
                text-align: right;
            }
            .colrow .name {
                min-width: 0;
            }
            .colrow .name strong {
                display: block;
                font-weight: 400;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .colrow .name code {
                font-size: 10px;
                color: #747474;
                background: none;
            }
            /* The comparable flags, kept visible per the column-row rule. */
            .flags {
                display: flex;
                gap: 2px;
            }
            .flag {
                width: 1.1rem;
                height: 1.1rem;
                border-radius: 0.2rem;
                font-size: 9px;
                font-weight: 700;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                background: #f3f3f3;
                color: #c9c9c9;
            }
            .flag.on {
                background: #e3edfd;
                color: #0250d9;
            }
            .dot {
                width: 0.55rem;
                height: 0.55rem;
                border-radius: 50%;
                display: inline-block;
                margin-left: 0.25rem;
            }

            /* ---------- inspector ---------- */
            .tabs {
                display: flex;
                border-bottom: 1px solid #e5e5e5;
                position: sticky;
                top: 0;
                background: #fff;
                z-index: 1;
            }
            .tabs button {
                flex: 1;
                border: 0;
                background: none;
                padding: 0.6rem 0.25rem;
                font-size: 13px;
                color: #444;
                cursor: pointer;
                border-bottom: 3px solid transparent;
            }
            .tabs button[aria-selected="true"] {
                color: #0250d9;
                font-weight: 700;
                border-bottom-color: #066afe;
            }
            .tabs button:disabled {
                color: #c9c9c9;
                cursor: default;
            }
            .inspect__head {
                padding: 0.75rem;
                border-bottom: 1px solid #e5e5e5;
                display: flex;
                align-items: center;
                gap: 0.5rem;
            }
            .inspect__head h2 {
                font-size: 14px;
                font-weight: 700;
            }
            .inspect__head code {
                font-size: 11px;
                color: #747474;
                background: none;
            }
            .group {
                padding: 0.6rem 0.75rem;
                border-bottom: 1px solid #f0f0f0;
                display: grid;
                gap: 0.5rem;
            }
            .group__title {
                font-size: 10px;
                text-transform: uppercase;
                letter-spacing: 0.06em;
                color: #5c5c5c;
                font-weight: 700;
            }
            .typed {
                background: #f3f3f3;
                border-radius: 0.25rem;
                padding: 0.5rem;
                display: grid;
                gap: 0.4rem;
            }
            .typed__why {
                font-size: 11px;
                color: #0250d9;
                font-weight: 700;
            }
            .row2 {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 0.5rem;
            }
            .row4 {
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                gap: 0.25rem;
            }
            .rule {
                border: 1px solid #e5e5e5;
                border-radius: 0.25rem;
                padding: 0.4rem 0.5rem;
                display: flex;
                gap: 0.4rem;
                align-items: center;
                font-size: 12px;
            }
            .swatch {
                width: 1.1rem;
                height: 1.1rem;
                border-radius: 0.15rem;
                display: inline-block;
                box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.15);
                flex: none;
            }
            .link {
                color: #0250d9;
                cursor: pointer;
                font-size: 12px;
            }
            .empty {
                padding: 1.5rem 1rem;
                text-align: center;
                color: #5c5c5c;
            }

            /* ---------- B: the dock ---------- */
            .dock {
                background: #fff;
                border: 1px solid #e5e5e5;
                border-radius: 0.25rem;
                display: grid;
                grid-template-columns: minmax(0, 1.3fr) minmax(18rem, 1fr);
                min-height: 22rem;
                flex: none;
            }
            .dock__list {
                border-right: 1px solid #e5e5e5;
                overflow: auto;
            }
            .dock__detail {
                overflow: auto;
            }
            table.cols {
                width: 100%;
                border-collapse: collapse;
                font-size: 12px;
            }
            table.cols th {
                font-size: 10px;
                text-transform: uppercase;
                letter-spacing: 0.04em;
                color: #5c5c5c;
                text-align: left;
                padding: 0.4rem;
                border-bottom: 1px solid #e5e5e5;
                background: #fafaf9;
            }
            table.cols td {
                padding: 0.3rem 0.4rem;
                border-bottom: 1px solid #f0f0f0;
                vertical-align: middle;
            }
            table.cols tr {
                cursor: pointer;
            }
            table.cols tr.is-selected td {
                background: #eef4ff;
            }
            table.cols tr.is-selected td:first-child {
                box-shadow: inset 3px 0 0 #066afe;
            }
            table.cols .slds-input {
                height: 1.7rem;
                font-size: 12px;
            }
            table.cols td.c {
                text-align: center;
            }

            /* ---------- C: drill-in ---------- */
            .back {
                display: flex;
                align-items: center;
                gap: 0.35rem;
                padding: 0.5rem 0.75rem;
                border-bottom: 1px solid #e5e5e5;
                color: #0250d9;
                cursor: pointer;
                font-size: 12px;
            }

            .note {
                margin-top: 0.6rem;
                color: #d8d8d8;
                font-size: 12px;
                line-height: 1.5;
            }
            .note b {
                color: #fff;
            }
        </style>
    </head>
    <body>
        <div class="switch">
            <strong>Layout:</strong>
            <button type="button" data-layout="a" aria-pressed="true">A · Three panes</button>
            <button type="button" data-layout="b" aria-pressed="false">B · Preview + column dock</button>
            <button type="button" data-layout="c" aria-pressed="false">C · Preview first, one inspector</button>
            <span class="why" id="why"></span>
        </div>

        <div class="modal">
            <div class="modal__head">
                <h1>Grid Studio</h1>
                <p>Changes apply immediately and are saved with the Flow element.</p>
            </div>
            <div class="modal__body" id="body"></div>
            <div class="modal__foot"><button class="slds-button slds-button_brand">Done</button></div>
        </div>

        <div class="note" id="note"></div>

        <script>
            /* ------------------------------------------------------------------ *
             * Data: the columns and records from the current Studio screenshot.
             * ------------------------------------------------------------------ */
            const COLUMNS = [
                {
                    field: "Name",
                    label: "Account Name",
                    type: "Text",
                    edit: false,
                    filter: false,
                    sort: true,
                    wrap: true
                },
                {
                    field: "Industry",
                    label: "Industry",
                    type: "Picklist",
                    edit: true,
                    filter: false,
                    sort: true,
                    wrap: true
                },
                {
                    field: "Description",
                    label: "Account Description",
                    type: "Long Text",
                    edit: false,
                    filter: false,
                    sort: true,
                    wrap: true
                },
                {
                    field: "Type",
                    label: "Account Type",
                    type: "Picklist",
                    edit: true,
                    filter: false,
                    sort: true,
                    wrap: true
                },
                {
                    field: "SLA__c",
                    label: "SLA",
                    type: "Picklist",
                    edit: true,
                    filter: false,
                    sort: true,
                    wrap: true,
                    headerIcon: true
                },
                {
                    field: "Percent_Test__c",
                    label: "Percent Test",
                    type: "Progress Bar",
                    edit: false,
                    filter: false,
                    sort: true,
                    wrap: true,
                    rules: [{ text: "Percent Test less than 30", color: "#ba0517" }]
                }
            ];
            const ROWS = [
                [
                    "Edge Communications",
                    "Electronics",
                    "Edge, founded in 1998, is a start-up based in Austin, TX.",
                    "Customer - Direct",
                    "Silver",
                    82
                ],
                ["Burlington Textiles Corp of America", "Apparel", "", "Customer - Direct", "Silver", 45],
                ["Pyramid Construction Inc.", "Construction", "", "Customer - Channel", "Silver", 18],
                ["Dickenson plc", "Consulting", "", "Customer - Channel", "Bronze", 60],
                [
                    "Grand Hotels & Resorts Ltd",
                    "Hospitality",
                    "Chain of hotels and resorts across the US, UK, Eastern Europe.",
                    "Customer - Direct",
                    "Gold",
                    100
                ],
                [
                    "United Oil & Gas Corp.",
                    "Energy",
                    "World's third largest oil and gas company.",
                    "Customer - Direct",
                    "Platinum",
                    25
                ]
            ];

            /* Table-level sections, with their real control labels. Configure
               Columns and Data Source are placed per layout, so they are apart. */
            const DATA_SECTIONS = [
                {
                    label: "Data Source",
                    open: true,
                    controls: [
                        ["check", "Use a User-Defined Object Instead of Salesforce Records"],
                        ["pill", "Records", "{!Get_Accounts}"],
                        ["pill", "Pre-Selected Records", ""],
                        ["pill", "Disabled Records", ""]
                    ]
                }
            ];
            const COLUMNS_SECTION = {
                label: "Configure Columns",
                open: true,
                controls: [["pill", "Columns", "6 fields · Account Name, Industry, Description…"]]
            };
            const TABLE_SECTIONS = [
                {
                    label: "Configure Rows",
                    controls: [
                        ["select", "Row Selection Mode", "Multiple"],
                        ["pair", "Minimum Selection", "", "Maximum Selection", ""],
                        ["check", "Require User to Make a Selection"],
                        ["select", "Unique Identifier", "Id"]
                    ]
                },
                {
                    label: "Table Display",
                    open: true,
                    controls: [
                        ["check", "Show a Header Above the Grid", true],
                        ["text", "Header Label", "Accounts"],
                        ["text", "Header Icon", "standard:account"],
                        ["check", "Show the Record Count in the Header", true],
                        ["check", "Show the Selected Count in the Header", true],
                        ["check", "Show Row Numbers", true],
                        ["check", "Limit Wrapped Text to Three Lines"],
                        ["check", "Show a Lock on Read-Only Columns", true],
                        ["pair", "Grid Height", "30", "Unit", "rem"]
                    ]
                },
                {
                    label: "Search, Filter & Sort",
                    controls: [
                        ["check", "Show a Search Bar", true],
                        ["check", "Limit Search to a Single Column"],
                        ["check", "Hide Column Header Actions"],
                        ["check", "Match Case on Column Filters", true]
                    ]
                },
                {
                    label: "Pagination",
                    controls: [
                        ["select", "Row Loading", "Paginate"],
                        ["text", "Records per Page", "10"],
                        ["check", "Let Users Change the Page Size"],
                        ["text", "Maximum Records to Display", ""]
                    ]
                },
                {
                    label: "Inline Editing",
                    controls: [
                        ["check", "Hide the Cancel/Save Buttons"],
                        ["check", "Go to the Next Flow Element on Save"]
                    ]
                },
                {
                    label: "Row Action",
                    controls: [
                        ["select", "Row Action", "Remove Row"],
                        ["select", "Display as", "Icon"],
                        ["select", "Action Column Position", "Left"],
                        ["text", "Hover Text", "Remove"],
                        ["text", "Maximum Rows That Can Be Removed", ""]
                    ]
                },
                {
                    label: "Links & Formatting",
                    controls: [
                        ["check", "Do Not Link the Name Field"],
                        ["check", "Open Links in the Same Tab"],
                        ["check", "Do Not Convert Currency Values"]
                    ]
                },
                { label: "Picklist Editing", controls: [["select", "Filter Picklists by Record Type", "Off"]] }
            ];

            /* ------------------------------------------------------------------ *
             * State
             * ------------------------------------------------------------------ */
            let layout = (location.hash || "#a").slice(1);
            let selected = 5; // Percent Test: the column with the most to show
            let inspectorTab = "column"; // A: "table" | "column"
            let cTab = "columns"; // C: "data" | "table" | "columns"
            let cDrilled = true; // C: inside a column

            /* ------------------------------------------------------------------ *
             * Pieces
             * ------------------------------------------------------------------ */
            const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");

            function control(c) {
                const [kind, label, a, b, bv] = c;
                if (kind === "check") {
                    return `<label class="check"><input type="checkbox" ${a ? "checked" : ""}/> ${esc(label)}</label>`;
                }
                if (kind === "pill") {
                    return `<div class="ctl"><span class="lbl">${esc(label)}</span><div class="pill-field">${a ? `<b>${esc(a)}</b>` : `<span style="color:#939393">Choose a resource…</span>`}</div></div>`;
                }
                if (kind === "select") {
                    return `<div class="ctl"><label>${esc(label)}</label><select class="slds-select"><option>${esc(a)}</option></select></div>`;
                }
                if (kind === "pair") {
                    return `<div class="row2"><div class="ctl"><label>${esc(label)}</label><input class="slds-input" value="${esc(a)}"/></div><div class="ctl"><label>${esc(b)}</label><input class="slds-input" value="${esc(bv)}"/></div></div>`;
                }
                return `<div class="ctl"><label>${esc(label)}</label><input class="slds-input" value="${esc(a)}"/></div>`;
            }

            function section(s) {
                return `<details class="section" ${s.open ? "open" : ""}><summary>${esc(s.label)}</summary><div class="section__body">${s.controls.map(control).join("")}</div></details>`;
            }

            function flags(c) {
                return `<span class="flags">${[
                    ["E", c.edit, "Edit"],
                    ["F", c.filter, "Filter"],
                    ["S", c.sort, "Sort"],
                    ["W", c.wrap, "Wrap"]
                ]
                    .map(
                        ([t, on, name]) =>
                            `<span class="flag ${on ? "on" : ""}" title="${name}: ${on ? "on" : "off"}">${t}</span>`
                    )
                    .join(
                        ""
                    )}${c.rules ? `<span class="dot" style="background:${c.rules[0].color}" title="Conditional color"></span>` : ""}</span>`;
            }

            function columnList() {
                return `<div class="collist">${COLUMNS.map(
                    (c, i) => `<div class="colrow ${i === selected ? "is-selected" : ""}" data-col="${i}">
                        <span class="num">${i + 1}</span>
                        <span class="name"><strong>${esc(c.label)}</strong><code>${esc(c.field)} · ${esc(c.type)}</code></span>
                        ${flags(c)}
                    </div>`
                ).join("")}</div>`;
            }

            function preview(extraHint = "") {
                const head = COLUMNS.map(
                    (c, i) =>
                        `<th data-col="${i}" class="${i === selected ? "is-selected" : ""}">${c.headerIcon ? "⛓ " : ""}${esc(c.label)} ▾</th>`
                ).join("");
                const body = ROWS.map(
                    (r, ri) =>
                        `<tr><td style="color:#747474">${ri + 1}</td><td style="color:#ba0517">🗑</td>${r
                            .map((v, ci) => {
                                const sel = ci === selected ? "is-selected" : "";
                                if (ci === 5) {
                                    return `<td class="${sel}" style="min-width:8rem"><div style="text-align:right;font-weight:700;font-size:11px">${v}%</div><div class="bar ${v < 30 ? "low" : ""}"><span style="width:${v}%"></span></div></td>`;
                                }
                                return `<td class="${sel}">${esc(v)}</td>`;
                            })
                            .join("")}</tr>`
                ).join("");
                return `<div class="preview">
                    <div class="preview__bar">
                        <div class="preview__banner">✓ Live preview using real records from this object.</div>
                        <div class="ctl" style="width:9rem"><select class="slds-select"><option>Preview size: Large</option></select></div>
                    </div>
                    <div class="preview__head"><span class="icon"></span><div><strong>Accounts</strong><small>6 items · 0 selected</small></div>
                        <input class="slds-input preview__search" placeholder="Search…" /></div>
                    <table class="grid"><thead><tr><th></th><th></th>${head}</tr></thead><tbody>${body}</tbody></table>
                    <p class="hint slds-m-top_x-small">Remove row action, shown as an icon on the left.${extraHint}</p>
                </div>`;
            }

            /* The column's own settings: everything that is not compared. In A
               and C the comparable ones live here too, since there is no row. */
            function columnDetail(c, { includeComparable }) {
                const comparable = includeComparable
                    ? `<div class="group"><div class="group__title">Column</div>
                        ${control(["text", "Label", c.label])}
                        <div class="row2">${control(["text", "Width", "Auto"])}${control(["select", "Align", "Default"])}</div>
                        <div class="row4">
                            ${[
                                ["Edit", c.edit],
                                ["Filter", c.filter],
                                ["Sort", c.sort],
                                ["Wrap", c.wrap]
                            ]
                                .map(
                                    ([n, on]) =>
                                        `<label class="check"><input type="checkbox" ${on ? "checked" : ""}/> ${n}</label>`
                                )
                                .join("")}
                        </div></div>`
                    : "";
                const gauge = c.type === "Progress Bar";
                const typed = gauge
                    ? `<div class="typed"><span class="typed__why">Because this column is a gauge</span>
                        <div class="row2">${control(["select", "Thickness", "Medium"])}${control(["select", "Ends", "Square"])}</div>
                        <label class="check"><input type="checkbox" checked/> Show the value</label>
                        <span class="hint">A gauge cannot be edited, so this column is read-only whatever the Edit box says.</span></div>`
                    : c.type === "Picklist"
                      ? `<div class="typed"><span class="typed__why">Because this column is a picklist</span><label class="check"><input type="checkbox"/> Show values as badges</label></div>`
                      : `<div class="typed"><span class="typed__why">Because this column is text</span><label class="check"><input type="checkbox"/> Turn URLs into links</label></div>`;
                const color = c.rules
                    ? `${control(["select", "How this column is colored", "Conditional — a color per cell, by rule"])}
                        ${c.rules
                            .map(
                                (r, i) =>
                                    `<div class="rule"><span class="hint">${i + 1}</span><span class="swatch" style="background:${r.color}"></span><span style="flex:1">${esc(r.text)} → ${r.color}</span><span class="link">Edit</span></div>`
                            )
                            .join("")}
                        <span class="link">+ Add rule</span>`
                    : control(["select", "How this column is colored", "None"]);
                return `${comparable}
                    <div class="group"><div class="group__title">Display</div>${control(["select", "Type", c.type])}${typed}</div>
                    <div class="group"><div class="group__title">Color</div>${color}</div>
                    <div class="group"><div class="group__title">Advanced</div>
                        ${control(["text", "Cell icon", ""])}${control(["text", "Header icon", c.headerIcon ? "utility:hierarchy" : ""])}
                        <span class="link">Reset this column</span></div>`;
            }

            function inspectorHead(c) {
                return `<div class="inspect__head"><span class="num" style="color:#747474">${selected + 1}</span><div><h2>${esc(c.label)}</h2><code>${esc(c.field)}</code></div></div>`;
            }

            /* ------------------------------------------------------------------ *
             * Layouts
             * ------------------------------------------------------------------ */
            const LAYOUTS = {
                a: {
                    why: "Data left, preview center, one inspector right. Clicking a column (list or header) opens it in the inspector.",
                    note: "<b>A — three panes.</b> The column list keeps the comparable flags visible as E/F/S/W chips, so the at-a-glance overview survives without a table. Label, width and align move into the column's inspector: they are compared less often than the flags, and a 22rem pane cannot hold them in a row. Cost: the preview loses ~40rem of width to two panes.",
                    render() {
                        const c = COLUMNS[selected];
                        const inspector =
                            inspectorTab === "table"
                                ? TABLE_SECTIONS.map(section).join("")
                                : `${inspectorHead(c)}${columnDetail(c, { includeComparable: true })}`;
                        return `<div class="pane pane_left">
                                <div class="pane__title">Data</div>${DATA_SECTIONS.map(section).join("")}${section(COLUMNS_SECTION)}
                                <div class="pane__title">Columns · click one to edit</div>${columnList()}
                            </div>
                            <div class="pane_center">${preview(" Click a column header to edit it.")}</div>
                            <div class="pane pane_right">
                                <div class="tabs" role="tablist">
                                    <button role="tab" data-itab="table" aria-selected="${inspectorTab === "table"}">Table</button>
                                    <button role="tab" data-itab="column" aria-selected="${inspectorTab === "column"}">Column</button>
                                </div>${inspector}
                            </div>`;
                    }
                },
                b: {
                    why: "Closest to today. Table settings stay left; the column table docks under the preview as master/detail.",
                    note: "<b>B — preview + column dock.</b> Keeps today's column table, so label, width, align and the four flags stay editable in the row and comparable across columns. What changes: the Settings drawer no longer opens full-width under the row; the selected column's detail sits beside the list, so opening it does not push the other columns off screen, and Configure Columns moves next to the list it controls. Cost: the preview and the dock share one scrolling pane, so with a tall preview the dock starts below the fold.",
                    render() {
                        const c = COLUMNS[selected];
                        const rows = COLUMNS.map(
                            (col, i) => `<tr class="${i === selected ? "is-selected" : ""}" data-col="${i}">
                                <td style="color:#747474;width:1.5rem">${i + 1}</td>
                                <td><code style="background:none;font-size:11px">${esc(col.field)}</code></td>
                                <td><input class="slds-input" value="${esc(col.label)}"/></td>
                                <td style="width:4.5rem"><input class="slds-input" placeholder="Auto"/></td>
                                <td style="width:6rem"><select class="slds-select" style="height:1.7rem;font-size:12px"><option>Default</option></select></td>
                                ${["edit", "filter", "sort", "wrap"].map((k) => `<td class="c"><input type="checkbox" ${col[k] ? "checked" : ""}/></td>`).join("")}
                                <td class="c">${col.rules ? `<span class="swatch" style="background:${col.rules[0].color}"></span>` : ""}</td>
                            </tr>`
                        ).join("");
                        return `<div class="pane pane_left"><div class="pane__title">Table</div>${DATA_SECTIONS.map(section).join("")}${TABLE_SECTIONS.map(section).join("")}</div>
                            <div class="pane_center">
                                ${preview()}
                                <div class="dock">
                                    <div class="dock__list">
                                        <div style="display:flex;align-items:center;gap:0.5rem;padding:0.5rem">
                                            <strong style="font-size:13px">Columns</strong>
                                            <div style="flex:1">${control(["pill", "", "6 fields · Account Name, Industry, Description…"]).replace('<span class="lbl"></span>', "")}</div>
                                            <span class="link">Reset all</span>
                                        </div>
                                        <table class="cols"><thead><tr><th>#</th><th>Field</th><th>Label</th><th>Width</th><th>Align</th><th>Edit</th><th>Filter</th><th>Sort</th><th>Wrap</th><th>Color</th></tr></thead><tbody>${rows}</tbody></table>
                                    </div>
                                    <div class="dock__detail">${inspectorHead(c)}${columnDetail(c, { includeComparable: false })}</div>
                                </div>
                            </div>`;
                    }
                },
                c: {
                    why: "Maximum preview. A single inspector on the right: Data, Table, Columns. A column drills in; Back returns.",
                    note: "<b>C — preview first.</b> The preview gets everything but 22rem. The Columns tab is the compact list with flag chips; choosing a column (there or in the preview header) drills into its settings, Back returns. It is one place for everything, at the price of never seeing two columns' settings, or a table setting and a column setting, at once.",
                    render() {
                        const c = COLUMNS[selected];
                        let content;
                        if (cTab === "data") {
                            content = DATA_SECTIONS.map(section).join("") + section(COLUMNS_SECTION);
                        } else if (cTab === "table") {
                            content = TABLE_SECTIONS.map(section).join("");
                        } else if (cDrilled) {
                            content = `<div class="back" data-back>‹ All columns</div>${inspectorHead(c)}${columnDetail(c, { includeComparable: true })}`;
                        } else {
                            content = `${section(COLUMNS_SECTION)}<div class="pane__title">Click a column to edit it</div>${columnList()}`;
                        }
                        return `<div class="pane_center">${preview(" Click a column header to edit it.")}</div>
                            <div class="pane pane_right">
                                <div class="tabs" role="tablist">
                                    ${[
                                        ["data", "Data"],
                                        ["table", "Table"],
                                        ["columns", "Columns"]
                                    ]
                                        .map(
                                            ([k, n]) =>
                                                `<button role="tab" data-ctab="${k}" aria-selected="${cTab === k}">${n}</button>`
                                        )
                                        .join("")}
                                </div>${content}
                            </div>`;
                    }
                }
            };

            /* ------------------------------------------------------------------ *
             * Wiring
             * ------------------------------------------------------------------ */
            function render() {
                const L = LAYOUTS[layout];
                document.getElementById("body").innerHTML = L.render();
                document.getElementById("why").textContent = L.why;
                document.getElementById("note").innerHTML = L.note;
                document
                    .querySelectorAll(".switch button")
                    .forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.layout === layout)));
            }

            document.addEventListener("click", (event) => {
                const layoutButton = event.target.closest("[data-layout]");
                if (layoutButton) {
                    layout = layoutButton.dataset.layout;
                    history.replaceState(null, "", `#${layout}`);
                    return render();
                }
                const col = event.target.closest("[data-col]");
                if (col && !event.target.matches("input, select")) {
                    selected = Number(col.dataset.col);
                    inspectorTab = "column";
                    cTab = "columns";
                    cDrilled = true;
                    return render();
                }
                const itab = event.target.closest("[data-itab]");
                if (itab) {
                    inspectorTab = itab.dataset.itab;
                    return render();
                }
                const ctab = event.target.closest("[data-ctab]");
                if (ctab) {
                    cTab = ctab.dataset.ctab;
                    if (cTab === "columns") {
                        cDrilled = false;
                    }
                    return render();
                }
                if (event.target.closest("[data-back]")) {
                    cDrilled = false;
                    return render();
                }
            });

            render();
        </script>
    </body>
</html>
