<!-- Read-only rendering is deliberately identical to a text cell. Showing the
     picklist LABEL instead of the stored value is a separate, agreed change that
     also has to rework search, sort and filter to match — until then, displaying
     a label the search box cannot find would be worse than showing the value.

     The badge is drawn in OUR markup, not through `cellAttributes.class`, which
     is why it survives the row hover: hover repaints the cell and never touches
     a nested span. Measured in repro/datatable-cell-colour/.

     `badgeClass` carries `slds-badge` plus whatever conditional formatting
     resolved for this row, composed in buildColumns. A conditional color on a
     badged column belongs on the badge; coloring the cell would paint around
     it. -->
<template>
    <template lwc:if={typeAttributes.badge}>
        <span class={typeAttributes.badgeClass} title={value}>{value}</span>
    </template>
    <template lwc:else>
        <span title={value}>{value}</span>
    </template>
</template>
